<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Transition</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      -webkit-app-region: drag;
    }

    .transition-mask {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle, #00d4ff33 0%, #00d4ff00 70%);
      opacity: 0;
      transition: opacity 0.9s ease-out;
    }

    .transition-mask.entering {
      opacity: 1;
    }

    .transition-mask.exiting {
      opacity: 0;
      transition: opacity 0.9s ease-in;
    }

    .transition-cursor {
      position: fixed;
      width: 8px;
      height: 8px;
      background: #00d4ff;
      border-radius: 50%;
      box-shadow: 0 0 10px #00d4ff, 0 0 20px #00d4ff;
      opacity: 0;
      transition: opacity 0.5s ease-out;
      z-index: 10;
    }

    .transition-cursor.visible {
      opacity: 1;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .transition-cursor.arriving {
      animation: arrive-pulse 1.2s ease-out forwards;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 10px #00d4ff, 0 0 20px #00d4ff;
      }
      50% {
        transform: scale(1.3);
        box-shadow: 0 0 15px #00d4ff, 0 0 30px #00d4ff;
      }
    }

    @keyframes arrive-pulse {
      0% {
        transform: scale(1.3);
        box-shadow: 0 0 15px #00d4ff, 0 0 30px #00d4ff;
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 10px #00d4ff, 0 0 20px #00d4ff;
        opacity: 0;
      }
    }

    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 212, 255, 0.03) 2px,
        rgba(0, 212, 255, 0.03) 4px
      );
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .scanlines.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="transition-mask" id="mask"></div>
  <div class="transition-cursor" id="cursor"></div>
  <div class="scanlines" id="scanlines"></div>

  <script>
    const mask = document.getElementById('mask');
    const cursor = document.getElementById('cursor');
    const scanlines = document.getElementById('scanlines');

    // Listen for transition commands from main process
    const { ipcRenderer } = require('electron');

    ipcRenderer.on('transition:enter', (event, fromX, fromY, toX, toY) => {
      // Show scanlines
      scanlines.classList.add('visible');

      // Position cursor at source (top-left of母程序)
      cursor.style.left = fromX + 'px';
      cursor.style.top = fromY + 'px';

      // Start entering mask animation
      mask.classList.add('entering');

      // After mask becomes visible, animate cursor to target
      setTimeout(() => {
        cursor.classList.add('visible');
        cursor.style.transition = 'left 0.6s ease-out, top 0.6s ease-out';
        cursor.style.left = toX + 'px';
        cursor.style.top = toY + 'px';
      }, 900);
    });

    ipcRenderer.on('transition:visible', (event) => {
      // Plugin window is visible, pulse the cursor
      cursor.classList.add('arriving');
    });

    ipcRenderer.on('transition:exit', (event) => {
      // Start exiting mask
      mask.classList.remove('entering');
      mask.classList.add('exiting');

      // Hide scanlines
      scanlines.classList.remove('visible');

      // Clean up cursor after exit
      setTimeout(() => {
        cursor.style.opacity = '0';
        mask.classList.remove('exiting');
      }, 900);
    });

    // Notify main process that transition window is ready
    ipcRenderer.send('transition:ready');
  </script>
</body>
</html>
