<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hundun Lite - 复古掌机效率工具</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    /* 预加载样式 - 防止白屏闪烁 */
    body {
      margin: 0;
      padding: 0;
      background: #0a0a0a;
      overflow: hidden;
    }
    #app {
      width: 100vw;
      height: 100vh;
    }
    /* 加载动画 */
    .app-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .app-loading-text {
      font-family: 'Press Start 2P', cursive;
      font-size: 12px;
      color: #00ff88;
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="app-loading">
      <div class="app-loading-text">LOADING...</div>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
