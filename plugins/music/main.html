<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/player.css">
  <link rel="stylesheet" href="css/library.css">
  <link rel="stylesheet" href="css/queue.css">
  <link rel="stylesheet" href="css/overlays.css">
</head>
<body>
  <div class="music-app" id="app">

    <!-- ===== Player View ===== -->
    <div id="view-player">
      <!-- Header -->
      <header class="mc-header">
        <div class="toggle-container">
          <span class="toggle-label" data-i18n="theme.dark">深色</span>
          <div class="toggle-switch" id="themeToggle">
            <div class="toggle-knob"></div>
          </div>
          <span class="toggle-label" data-i18n="theme.light">浅色</span>
        </div>
        <div class="mc-logo">
          <span class="logo-icon"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g fill="currentColor"><ellipse cx="7.1" cy="18.1" rx="3.7" ry="2.85" transform="rotate(-22 7.1 18.1)"/><ellipse cx="17.7" cy="16.1" rx="3.7" ry="2.85" transform="rotate(-22 17.7 16.1)"/><rect x="9.3" y="6.1" width="1.9" height="12.3" rx="0.95"/><rect x="19.9" y="4.1" width="1.9" height="12.3" rx="0.95"/><path d="M9.3 6.1 L21.8 3.85 L21.8 7.55 L9.3 9.8 Z"/></g></svg></span>
          <span class="logo-text">MUSIC</span>
        </div>
        <button class="mc-pin-btn" id="pinBtn" title="置顶">📌</button>
        <button class="mc-min-btn" id="minBtn" data-i18n-title="header.minimize" title="最小化"></button>
        <button class="mc-close-btn" id="closeBtn" data-i18n-title="header.back" title="返回">✕</button>
      </header>

      <!-- Stage: 左 = 磁带机主体, 右 = 曲目信息与控制 -->
      <main class="mc-stage" id="mcStage">
        <section class="stage-deck">
          <div class="deck-glow" aria-hidden="true"></div>

          <div class="cassette" id="cassette">
            <svg class="cassette-svg" viewBox="0 0 344 260" fill="none" aria-hidden="true">
              <defs>
                <!-- 盘上的磁带: 极细的同心色带, 模拟一层层缠上去的带子 -->
                <radialGradient id="packFill" cx="50%" cy="50%" r="50%">
                  <stop offset="0" stop-opacity="0.03"/>
                  <stop offset="0.55" stop-opacity="0.05"/>
                  <stop offset="0.86" stop-opacity="0.07"/>
                  <stop offset="1" stop-opacity="0.10"/>
                </radialGradient>
              </defs>

              <!-- 后面叠的一张: 只露出上沿轮廓 -->
              <rect class="ghost ghost-near" x="12" y="12" width="330" height="224" rx="12"/>

              <!-- 外壳轮廓 -->
              <rect class="shell" x="1" y="24" width="342" height="234" rx="14"/>
              <!-- 顶边导轨: 走带开口 -->
              <rect class="guide-rail" x="128" y="29" width="88" height="11" rx="3"/>
              <rect class="guide-tab" x="136" y="33" width="16" height="3" rx="1.5"/>
              <rect class="guide-tab" x="164" y="33" width="16" height="3" rx="1.5"/>
              <rect class="guide-tab" x="192" y="33" width="16" height="3" rx="1.5"/>

              <!-- 带仓 -->
              <rect class="well" x="40" y="52" width="264" height="116" rx="8"/>
              <!-- 走带路径: 带子从左盘经两个导带轮绕到右盘 -->
              <path class="tape-path" d="M72 159H272"/>

              <!-- 带仓四角定位刻线 -->
              <path class="reg-mark" d="M52 60v10M52 60h10"/>
              <path class="reg-mark" d="M292 60v10M292 60h-10"/>
              <path class="reg-mark" d="M52 160v-10M52 160h10"/>
              <path class="reg-mark" d="M292 160v-10M292 160h-10"/>

              <g class="reel" id="reelL">
                <g class="pack-wrap" style="--pack-scale: 1">
                  <circle class="pack-fill" cx="110" cy="110" r="46"/>
                  <circle class="pack-ring" cx="110" cy="110" r="46"/>
                </g>
                <g class="hub">
                  <circle class="hub-ring" cx="110" cy="110" r="12"/>
                  <circle class="tooth" cx="117.2" cy="110" r="1.6"/>
                  <circle class="tooth" cx="115.1" cy="115.1" r="1.6"/>
                  <circle class="tooth" cx="110" cy="117.2" r="1.6"/>
                  <circle class="tooth" cx="104.9" cy="115.1" r="1.6"/>
                  <circle class="tooth" cx="102.8" cy="110" r="1.6"/>
                  <circle class="tooth" cx="104.9" cy="104.9" r="1.6"/>
                  <circle class="tooth" cx="110" cy="102.8" r="1.6"/>
                  <circle class="tooth" cx="115.1" cy="104.9" r="1.6"/>
                  <circle class="hub-inner" cx="110" cy="110" r="4.8"/>
                  <circle class="hub-dot" cx="110" cy="110" r="2.1"/>
                </g>
              </g>

              <g class="reel" id="reelR">
                <g class="pack-wrap" style="--pack-scale: 0.565">
                  <circle class="pack-fill" cx="234" cy="110" r="46"/>
                  <circle class="pack-ring" cx="234" cy="110" r="46"/>
                </g>
                <g class="hub">
                  <circle class="hub-ring" cx="234" cy="110" r="12"/>
                  <circle class="tooth" cx="241.2" cy="110" r="1.6"/>
                  <circle class="tooth" cx="239.1" cy="115.1" r="1.6"/>
                  <circle class="tooth" cx="234" cy="117.2" r="1.6"/>
                  <circle class="tooth" cx="228.9" cy="115.1" r="1.6"/>
                  <circle class="tooth" cx="226.8" cy="110" r="1.6"/>
                  <circle class="tooth" cx="228.9" cy="104.9" r="1.6"/>
                  <circle class="tooth" cx="234" cy="102.8" r="1.6"/>
                  <circle class="tooth" cx="239.1" cy="104.9" r="1.6"/>
                  <circle class="hub-inner" cx="234" cy="110" r="4.8"/>
                  <circle class="hub-dot" cx="234" cy="110" r="2.1"/>
                </g>
              </g>

              <!-- 带仓底部两个导带轮 -->
              <circle class="roller" cx="68" cy="159" r="4"/>
              <circle class="roller" cx="276" cy="159" r="4"/>

              <!-- 图纸基准刻度尺 -->
              <path class="ruler" d="M40 184H304 M40 184v-6 M52 184v-3 M64 184v-3 M76 184v-3 M88 184v-6 M100 184v-3 M112 184v-3 M124 184v-3 M136 184v-6 M148 184v-3 M160 184v-3 M172 184v-3 M184 184v-6 M196 184v-3 M208 184v-3 M220 184v-3 M232 184v-6 M244 184v-3 M256 184v-3 M268 184v-3 M280 184v-6 M292 184v-3 M304 184v-3 M40 184v4 M304 184v4"/>

              <!-- 四角螺丝 -->
              <g class="screw" transform="translate(14 36)">
                <circle r="3.1"/><path d="M-2.2 0h4.4M0-2.2v4.4"/>
              </g>
              <g class="screw" transform="translate(330 36)">
                <circle r="3.1"/><path d="M-2.2 0h4.4M0-2.2v4.4"/>
              </g>
              <g class="screw" transform="translate(14 246)">
                <circle r="3.1"/><path d="M-2.2 0h4.4M0-2.2v4.4"/>
              </g>
              <g class="screw" transform="translate(330 246)">
                <circle r="3.1"/><path d="M-2.2 0h4.4M0-2.2v4.4"/>
              </g>
            </svg>

            <div class="cassette-label">
              <span class="label-chip">MUSIC</span>
              <span class="label-text" id="cassetteTitle">—</span>
            </div>
          </div>

        </section>

        <section class="stage-panel">
          <div class="panel-inner">
            <h1 class="np-title" id="npTitle" data-i18n="player.emptyTitle">还没有音乐</h1>

            <div class="np-progress">
              <div class="np-row">
                <span class="np-time" id="npCur">00:00</span>
                <span class="np-sep">/</span>
                <span class="np-time" id="npDur">00:00</span>
              </div>
              <div class="seek" id="seek">
                <div class="seek-track"></div>
                <div class="seek-fill" id="seekFill"></div>
                <div class="seek-knob" id="seekKnob"></div>
              </div>
            </div>

            <div class="transport">
              <button class="tp-btn" id="btnPrev" data-i18n-title="player.prev" title="上一首">
                <svg class="tp-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="19,5 19,19 8,12"/><rect x="4" y="5" width="2.4" height="14"/></svg>
              </button>
              <button class="tp-btn tp-play" id="btnPlay" title="播放/暂停">
                <svg class="tp-svg tp-icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="8,5 8,19 19,12"/></svg>
                <svg class="tp-svg tp-icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="5" width="3.4" height="14"/><rect x="13.6" y="5" width="3.4" height="14"/></svg>
              </button>
              <button class="tp-btn" id="btnNext" data-i18n-title="player.next" title="下一首">
                <svg class="tp-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="5,5 5,19 16,12"/><rect x="17.6" y="5" width="2.4" height="14"/></svg>
              </button>
              <button class="tp-btn tp-mode" id="btnMode" title="顺序播放">
                <svg class="tp-svg tp-icon-seq" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M4 12h9M4 18h9"/><path d="M16 8l4 4-4 4"/></svg>
                <svg class="tp-svg tp-icon-shuffle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h4v4"/><path d="M4 20L20 4"/><path d="M16 20h4v-4"/><path d="M4 4l6 6"/><path d="M14 14l6 6"/></svg>
                <svg class="tp-svg tp-icon-loop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2.6l3.4 3.4L17 9.4"/><path d="M20.4 6H6.6A2.6 2.6 0 0 0 4 8.6V10"/><path d="M7 21.4L3.6 18 7 14.6"/><path d="M3.6 18h13.8a2.6 2.6 0 0 0 2.6-2.6V14"/><path d="M12.4 10.4l1.5-1.1v5.4"/></svg>
              </button>
            </div>

            <div class="transport-wrap">
              <div class="np-empty" id="npEmpty">
                <button class="np-empty-btn" id="npEmptyBtn" data-i18n="player.openLibrary">打开音乐库</button>
              </div>

            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- 底部抽屉把手 (音乐库) -->
    <button class="drawer1-handle" id="drawer1Handle">
      <span class="dh-grip"></span>
      <span class="dh-label" data-i18n="library.title">音乐库</span>
    </button>

    <!-- 右侧抽屉把手 (播放队列) -->
    <button class="drawer2-handle" id="drawer2Handle">
      <span class="dh2-label" data-i18n="queue.title">队列</span>
    </button>

    <!-- 底部通栏电平柱: 铺满整行, 层级低于抽屉把手 (z-index 5 < 55) -->
    <div class="mc-eq-bar" id="mcEqBar" aria-hidden="true"></div>

    <!-- 顶部弹幕: 每 10s 飘过一次「下一首」 -->
    <div class="mc-bullet" id="mcBullet" aria-hidden="true">
      <span class="mc-bullet-text" id="mcBulletText"></span>
    </div>

    <!-- 播放内核 -->
    <audio id="audioEl" preload="metadata"></audio>

    <!-- ===== Drawer 1: 音乐库 ===== -->
    <div class="drawer1" id="drawer1">
      <div class="d1-body">
        <aside class="d1-side">
          <button class="d1-add-group" id="addGroupBtn">
            <span class="ic">+</span>
            <span data-i18n="library.newGroup">新建分组</span>
          </button>
          <div class="d1-groups" id="groupList"></div>
        </aside>
        <div class="d1-main">
          <div class="d1-search">
            <svg class="search-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>
            <input class="search-input" id="libSearch" data-i18n-placeholder="library.searchPlaceholder" placeholder="搜索音乐..." />
          </div>
          <div class="d1-list" id="songList"></div>
        </div>
      </div>
      <footer class="d1-footer">
        <div class="d1-footer-btns">
          <button class="footer-btn" id="importBtn" data-i18n-title="library.import" title="导入音乐">
            <span class="btn-icon">+</span>
          </button>
          <button class="footer-btn" id="folderBtn" data-i18n-title="library.folder" title="在文件管理器中打开">
            <span class="btn-icon">📁</span>
          </button>
          <button class="footer-btn" id="refreshBtn" data-i18n-title="library.refresh" title="刷新">
            <span class="btn-icon"><svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="21 4 21 10 15 10"/><polyline points="3 20 3 14 9 14"/><path d="M4.2 9a8.5 8.5 0 0 1 14-3.2L21 10"/><path d="M19.8 15a8.5 8.5 0 0 1-14 3.2L3 14"/></svg></span>
          </button>
        </div>
        <div class="d1-info" id="libInfo"></div>
      </footer>
    </div>

    <!-- ===== Drawer 2: 播放队列 ===== -->
    <div class="drawer2" id="drawer2">
      <div class="d2-head">
        <span class="d2-title" data-i18n="queue.title">播放队列</span>
        <button class="d2-close" id="d2Close" title="✕">✕</button>
      </div>
      <div class="d2-list" id="queueList"></div>
      <div class="d2-hint" data-i18n="queue.hint">拖动排序 · Shift+↑/↓ 移动 · ✕ 移除</div>
    </div>

    <!-- ===== Modal ===== -->
    <div class="mc-modal-overlay" id="modalOverlay" style="display:none;">
      <div class="mc-modal">
        <div class="modal-icon" id="modalIcon"></div>
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-message" id="modalMessage"></div>
        <input class="modal-input" id="modalInput" style="display:none;" />
        <div class="modal-buttons" id="modalButtons"></div>
      </div>
    </div>

    <!-- ===== 分组弹层 (歌曲卡片「添加分组」) ===== -->
    <div class="group-popover" id="groupPopover" style="display:none;"></div>

    <!-- ===== 拖入提示 ===== -->
    <div class="drop-hint" id="dropHint" style="display:none;">
      <div class="drop-hint-box">
        <div class="drop-hint-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><ellipse cx="7.1" cy="18.1" rx="3.7" ry="2.85" transform="rotate(-22 7.1 18.1)"/><ellipse cx="17.7" cy="16.1" rx="3.7" ry="2.85" transform="rotate(-22 17.7 16.1)"/><rect x="9.3" y="6.1" width="1.9" height="12.3" rx="0.95"/><rect x="19.9" y="4.1" width="1.9" height="12.3" rx="0.95"/><path d="M9.3 6.1 L21.8 3.85 L21.8 7.55 L9.3 9.8 Z"/></g></svg></div>
        <div class="drop-hint-text" data-i18n="import.dropHere">松手导入音乐 (源文件将被移入)</div>
      </div>
    </div>

    <!-- ===== Toast ===== -->
    <div id="toastContainer"></div>
  </div>

  <script src="js/sdk.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/i18n-html.js"></script>
  <script src="js/app-state.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/library.js"></script>
  <script src="js/importer.js"></script>
  <script src="js/player.js"></script>
  <script src="js/render-player.js"></script>
  <script src="js/render-library.js"></script>
  <script src="js/render-queue.js"></script>
  <script src="js/keyboard.js"></script>
  <script src="js/events.js"></script>
  <script src="js/theme-sync.js"></script>
  <script src="js/init.js"></script>
</body>
</html>
