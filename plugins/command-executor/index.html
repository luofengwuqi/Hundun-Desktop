<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>命令执行器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #141414;
      --bg-card: #1a1a1a;
      --accent-primary: #ff0080;
      --accent-secondary: #00ff88;
      --accent-tertiary: #00d4ff;
      --text-primary: #e0e0e0;
      --text-secondary: #888;
      --text-muted: #555;
      --border-color: #333;
      --shadow-color: rgba(255, 0, 128, 0.3);
    }

    body {
      font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      padding: 0;
      overflow: hidden;
    }

    /* ========== Header ========== */
    .executor-header {
      height: 48px;
      background: var(--bg-secondary);
      border-bottom: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      -webkit-app-region: drag;
      flex-shrink: 0;
      position: relative;
    }

    .executor-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    .executor-logo .logo-icon {
      font-size: 16px;
    }

    .executor-logo .logo-text {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: var(--accent-primary);
      letter-spacing: 2px;
      text-shadow: 0 0 10px var(--accent-primary);
    }

    .executor-logo .logo-chip {
      font-family: 'Press Start 2P', monospace;
      font-size: 6px;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 2px 4px;
      letter-spacing: 1px;
    }

    .executor-header-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    .executor-pin-btn,
    .executor-close-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--accent-primary);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      -webkit-app-region: no-drag;
      z-index: 102;
    }

    .executor-pin-btn:hover,
    .executor-close-btn:hover {
      color: var(--accent-secondary);
      box-shadow: 0 0 12px var(--shadow-color);
      transform: scale(1.1);
    }

    .executor-pin-btn:hover {
      transform: scale(1.1) rotate(-15deg);
    }

    .executor-pin-btn.pinned {
      color: var(--accent-secondary);
      transform: rotate(-45deg);
      text-shadow: 0 0 12px var(--accent-secondary);
      filter: drop-shadow(0 0 6px var(--accent-secondary));
    }

    .executor-pin-btn.pinned:hover {
      transform: scale(1.1) rotate(-45deg);
    }

    /* ========== Terminal ========== */
    .terminal {
      background: #0a0a0a;
      border-radius: 8px;
      padding: 15px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      height: 400px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      margin: 20px;
    }

    .terminal-line {
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .terminal-line.input {
      color: var(--accent-secondary);
    }

    .terminal-line.output {
      color: var(--text-secondary);
    }

    .terminal-line.error {
      color: var(--accent-primary);
    }

    .input-area {
      margin: 0 20px;
      display: flex;
      gap: 10px;
    }

    .command-input {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 10px 15px;
      color: var(--text-primary);
      font-family: 'Courier New', monospace;
      font-size: 14px;
    }

    .command-input:focus {
      outline: none;
      border-color: var(--accent-primary);
    }

    .execute-btn {
      background: var(--accent-primary);
      color: #000;
      border: none;
      border-radius: 4px;
      padding: 10px 20px;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .execute-btn:hover {
      box-shadow: 0 0 12px var(--shadow-color);
      transform: scale(1.05);
    }

    .history {
      margin: 20px;
    }

    .history-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .history-item {
      background: var(--bg-card);
      border-radius: 4px;
      padding: 8px 12px;
      margin-bottom: 5px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .history-item:hover {
      background: var(--bg-secondary);
      border-color: var(--accent-primary);
    }
  </style>
</head>
<body>
  <div class="executor-header">
    <div class="executor-logo">
      <span class="logo-icon">⌨</span>
      <span class="logo-text">EXEC</span>
      <span class="logo-chip">TERMINAL</span>
    </div>
    <div class="executor-header-buttons">
      <button class="executor-pin-btn" id="pinBtn" title="窗口置顶">📌</button>
      <button class="executor-close-btn" id="closeBtn" title="返回母程序">✕</button>
    </div>
  </div>

  <div class="terminal" id="terminal">
    <div class="terminal-line output">欢迎使用命令执行器</div>
    <div class="terminal-line output">输入命令并按回车执行</div>
    <div class="terminal-line output">----------------------------------------</div>
  </div>

  <div class="input-area">
    <input 
      type="text" 
      class="command-input" 
      id="commandInput" 
      placeholder="输入命令..."
      onkeypress="handleKeyPress(event)"
    >
    <button class="execute-btn" onclick="executeCommand()">执行</button>
  </div>

  <div class="history">
    <div class="history-title">最近命令</div>
    <div id="historyList">
      <div class="history-item" onclick="reuseCommand('ls -la')">ls -la</div>
      <div class="history-item" onclick="reuseCommand('pwd')">pwd</div>
      <div class="history-item" onclick="reuseCommand('echo Hello World')">echo Hello World</div>
    </div>
  </div>

  <script>
    const terminal = document.getElementById('terminal');
    const commandInput = document.getElementById('commandInput');
    let commandHistory = [];

    // ========== 关闭按钮 ==========
    document.getElementById('closeBtn').addEventListener('click', async () => {
      if (window.hundun && window.hundun.host && window.hundun.host.returnToParent) {
        await window.hundun.host.returnToParent();
      } else if (window.hundun && window.hundun.window && window.hundun.window.close) {
        await window.hundun.window.close();
      } else {
        window.close();
      }
    });

    // ========== 图钉按钮 ==========
    document.getElementById('pinBtn').addEventListener('click', async function() {
      this.classList.toggle('pinned');
      const pinned = this.classList.contains('pinned');
      if (window.hundun && window.hundun.window && window.hundun.window.setAlwaysOnTop) {
        await window.hundun.window.setAlwaysOnTop(pinned);
      }
    });

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        executeCommand();
      }
    }

    function executeCommand() {
      const command = commandInput.value.trim();
      if (!command) return;

      // 显示命令
      addTerminalLine(`$ ${command}`, 'input');
      
      // 模拟命令输出
      setTimeout(() => {
        let output = '';
        if (command === 'ls -la') {
          output = `total 32
drwxr-xr-x  5 user user 4096 Aug  6 17:00 .
drwxr-xr-x  3 user user 4096 Aug  6 17:00 ..
-rw-r--r--  1 user user  220 Aug  6 17:00 .bash_logout
-rw-r--r--  1 user user 3771 Aug  6 17:00 .bashrc
-rw-r--r--  1 user user  807 Aug  6 17:00 .profile`;
        } else if (command === 'pwd') {
          output = '/home/user';
        } else if (command.startsWith('echo ')) {
          output = command.slice(5);
        } else {
          output = `bash: ${command.split(' ')[0]}: command not found`;
          addTerminalLine(output, 'error');
          commandInput.value = '';
          return;
        }

        addTerminalLine(output, 'output');
        commandHistory.unshift(command);
        commandInput.value = '';
      }, 100);
    }

    function addTerminalLine(text, type) {
      const line = document.createElement('div');
      line.className = `terminal-line ${type}`;
      line.textContent = text;
      terminal.appendChild(line);
      terminal.scrollTop = terminal.scrollHeight;
    }

    function reuseCommand(command) {
      commandInput.value = command;
      commandInput.focus();
    }
  </script>
</body>
</html>
