<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>定时任务管理器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #141414;
      --bg-card: #1a1a1a;
      --accent-primary: #00ff88;
      --accent-secondary: #ff0080;
      --accent-tertiary: #00d4ff;
      --text-primary: #e0e0e0;
      --text-secondary: #888;
      --text-muted: #555;
      --border-color: #333;
      --shadow-color: rgba(0, 255, 136, 0.3);
    }

    body {
      font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      padding: 0;
      overflow: hidden;
    }

    /* ========== Header ========== */
    .timer-header {
      height: 48px;
      background: var(--bg-secondary);
      border-bottom: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      -webkit-app-region: drag;
      flex-shrink: 0;
      position: relative;
    }

    .timer-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    .timer-logo .logo-icon {
      font-size: 16px;
    }

    .timer-logo .logo-text {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: var(--accent-primary);
      letter-spacing: 2px;
      text-shadow: 0 0 10px var(--accent-primary);
    }

    .timer-logo .logo-chip {
      font-family: 'Press Start 2P', monospace;
      font-size: 6px;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 2px 4px;
      letter-spacing: 1px;
    }

    .timer-header-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    .timer-pin-btn,
    .timer-close-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--accent-primary);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      -webkit-app-region: no-drag;
      z-index: 102;
    }

    .timer-pin-btn:hover,
    .timer-close-btn:hover {
      color: var(--accent-secondary);
      box-shadow: 0 0 12px var(--shadow-color);
      transform: scale(1.1);
    }

    .timer-pin-btn:hover {
      transform: scale(1.1) rotate(-15deg);
    }

    .timer-pin-btn.pinned {
      color: var(--accent-secondary);
      transform: rotate(-45deg);
      text-shadow: 0 0 12px var(--accent-secondary);
      filter: drop-shadow(0 0 6px var(--accent-secondary));
    }

    .timer-pin-btn.pinned:hover {
      transform: scale(1.1) rotate(-45deg);
    }

    /* ========== Content ========== */
    .timer-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
      max-height: calc(100vh - 48px);
      overflow-y: auto;
    }

    .timer-item {
      background: var(--bg-card);
      border-radius: 8px;
      padding: 15px;
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }

    .timer-item:hover {
      border-color: var(--accent-primary);
      box-shadow: 0 0 12px var(--shadow-color);
    }

    .timer-info {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .timer-name {
      font-weight: bold;
      color: var(--accent-primary);
    }

    .timer-time {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .timer-actions {
      display: flex;
      gap: 10px;
    }

    .action-btn {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s ease;
    }

    .action-btn.start {
      background: var(--accent-primary);
      color: #000;
    }

    .action-btn.start:hover {
      box-shadow: 0 0 12px var(--shadow-color);
      transform: scale(1.05);
    }

    .action-btn.stop {
      background: var(--accent-secondary);
      color: #000;
    }

    .action-btn.stop:hover {
      box-shadow: 0 0 12px rgba(255, 0, 128, 0.3);
      transform: scale(1.05);
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="timer-header">
    <div class="timer-logo">
      <span class="logo-icon">⏰</span>
      <span class="logo-text">TIMER</span>
      <span class="logo-chip">MANAGER</span>
    </div>
    <div class="timer-header-buttons">
      <button class="timer-pin-btn" id="pinBtn" title="窗口置顶">📌</button>
      <button class="timer-close-btn" id="closeBtn" title="返回母程序">✕</button>
    </div>
  </div>

  <div class="timer-list" id="timerList">
    <div class="timer-item">
      <div class="timer-info">
        <div class="timer-name">每日提醒</div>
        <div class="timer-time">每天 09:00</div>
      </div>
      <div class="timer-actions">
        <button class="action-btn start">启动</button>
        <button class="action-btn stop">停止</button>
      </div>
    </div>

    <div class="timer-item">
      <div class="timer-info">
        <div class="timer-name">工作休息提醒</div>
        <div class="timer-time">每 45 分钟</div>
      </div>
      <div class="timer-actions">
        <button class="action-btn start">启动</button>
        <button class="action-btn stop">停止</button>
      </div>
    </div>

    <div class="timer-item">
      <div class="timer-info">
        <div class="timer-name">喝水提醒</div>
        <div class="timer-time">每 30 分钟</div>
      </div>
      <div class="timer-actions">
        <button class="action-btn start">启动</button>
        <button class="action-btn stop">停止</button>
      </div>
    </div>
  </div>

  <div class="empty-state" style="display: none;">
    <div class="icon">⏰</div>
    <p>还没有定时任务</p>
    <p>点击下方按钮添加第一个定时任务</p>
  </div>

  <script>
    // ========== 关闭按钮 ==========
    document.getElementById('closeBtn').addEventListener('click', async () => {
      if (window.hundun && window.hundun.host && window.hundun.host.returnToParent) {
        await window.hundun.host.returnToParent();
      } else if (window.hundun && window.hundun.window && window.hundun.window.close) {
        await window.hundun.window.close();
      } else {
        window.close();
      }
    });

    // ========== 图钉按钮 ==========
    document.getElementById('pinBtn').addEventListener('click', async function() {
      this.classList.toggle('pinned');
      const pinned = this.classList.contains('pinned');
      if (window.hundun && window.hundun.window && window.hundun.window.setAlwaysOnTop) {
        await window.hundun.window.setAlwaysOnTop(pinned);
      }
    });
  </script>
</body>
</html>
