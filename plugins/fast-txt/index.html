    <!-- ===== Modal Overlay ===== -->
    <div class="ftxt-modal-overlay" id="modalOverlay" style="display:none;">
      <div class="ftxt-modal" id="modalBox">
        <div class="modal-icon" id="modalIcon"></div>
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-message" id="modalMessage"></div>
        <div class="modal-buttons" id="modalButtons"></div>
      </div>
    </div>

    <!-- ===== Create Menu Overlay ===== -->
    <div class="ftxt-modal-overlay" id="createMenuOverlay" style="display:none;">
      <div class="ftxt-modal create-menu">
        <div class="modal-icon">+</div>
        <div class="modal-title">CREATE NEW</div>
        <div class="create-options" id="createOptions">
          <button class="create-option" data-idx="0">
            <span class="create-icon">📄</span>
            <span class="create-label">.txt File</span>
          </button>
          <button class="create-option" data-idx="1">
            <span class="create-icon">📝</span>
            <span class="create-label">.md File</span>
          </button>
          <button class="create-option" data-idx="2">
            <span class="create-icon">📁</span>
            <span class="create-label">Folder</span>
          </button>
        </div>
        <div class="modal-buttons">
          <button class="modal-btn secondary" id="createMenuCancel">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ========== PluginSDK: playSound ==========
    const _pluginAudioCache = {};
    const _pluginSoundMap = {
      click: 'sounds/click.mp3', change: 'sounds/change.mp3',
      OK: 'sounds/OK.mp3', exit: 'sounds/exit.mp3', error: 'sounds/error.mp3',
      bengbeng: 'sounds/bengbeng.mp3', loading: 'sounds/loading.mp3',
      home: 'sounds/home.mp3', setting: 'sounds/setting.mp3'
    };
    const playSound = async (name) => {
      try {
        const src = _pluginSoundMap[name];
        if (!src) return;
        const path = require('path');
        // 项目根目录: plugins/fast-txt/ → 往上两级
        const root = path.resolve(__dirname || '.', '..', '..');
        const absPath = path.join(root, src).replace(/\\/g, '/');
        const fileUrl = 'file:///' + absPath;
        if (!_pluginAudioCache[name]) {
          _pluginAudioCache[name] = new Audio(fileUrl);
        }
        const audio = _pluginAudioCache[name];
        audio.currentTime = 0;
        audio.volume = 0.5;
        audio.play().catch(() => {});
      } catch (e) {
        // fallback: IPC
        if (window.hundun && window.hundun.host && window.hundun.host.playSound) {
          window.hundun.host.playSound(name);
        }
      }
    };

    // ========== returnToParent ==========
    const returnToParent = async () => {
      if (window.hundun && window.hundun.host && window.hundun.host.returnToParent) {
        await window.hundun.host.returnToParent();
      } else if (window.hundun && window.hundun.window && window.hundun.window.close) {
        await window.hundun.window.close();
      } else {
        window.close();
      }
    };

    // ========== DOM Refs ==========
    const appEl = document.getElementById('app');
    const viewMain = document.getElementById('view-main');
    const viewEditor = document.getElementById('view-editor');
    const closeBtn = document.getElementById('closeBtn');
    const searchInput = document.getElementById('searchInput');
    const fileList = document.getElementById('fileList');
    const trashZone = document.getElementById('trashZone');
    const shredderZone = document.getElementById('shredderZone');
    const footerButtons = document.getElementById('footerButtons');
    const fileCountEl = document.getElementById('fileCount');
    const trashCountEl = document.getElementById('trashCount');
    const folderBreadcrumb = document.getElementById('folderBreadcrumb');
    const breadcrumbBack = document.getElementById('breadcrumbBack');
    const breadcrumbPath = document.getElementById('breadcrumbPath');
    const editorIcon = document.getElementById('editorIcon');
    const editorTitle = document.getElementById('editorTitle');
    const editorCloseBtn = document.getElementById('editorCloseBtn');
    const lineNumbers = document.getElementById('lineNumbers');
    const editorTextarea = document.getElementById('editorTextarea');
    const statusLines = document.getElementById('statusLines');
    const statusChars = document.getElementById('statusChars');
    const statusType = document.getElementById('statusType');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalIcon = document.getElementById('modalIcon');
    const modalTitle = document.getElementById('modalTitle');
    const modalMessage = document.getElementById('modalMessage');
    const modalButtons = document.getElementById('modalButtons');
    const createMenuOverlay = document.getElementById('createMenuOverlay');
    const createOptions = document.getElementById('createOptions');
    const createMenuCancel = document.getElementById('createMenuCancel');

    // Find & Replace
    const findBar = document.getElementById('findBar');
    const findInput = document.getElementById('findInput');
    const findCount = document.getElementById('findCount');
    const findPrevBtn = document.getElementById('findPrevBtn');
    const findNextBtn = document.getElementById('findNextBtn');
    const findCloseBtn = document.getElementById('findCloseBtn');
    const replaceRow = document.getElementById('replaceRow');
    const replaceInput = document.getElementById('replaceInput');
    const replaceOneBtn = document.getElementById('replaceOneBtn');
    const replaceAllBtn = document.getElementById('replaceAllBtn');
    const autoSaveIndicator = document.getElementById('autoSaveIndicator');
    const statusWords = document.getElementById('statusWords');

    // ========== State ==========
    let currentView = 'main';
    let searchQuery = '';
    let isTrashMode = false;
    let isFolderMode = false;
    let currentFolderPath = '';  // e.g. 'NewFolder' or 'NewFolder/SubFolder'
    let isTrashDragOver = false;
    let isShredderDragOver = false;
    let dragFileId = null;

    let selectedRow = 0;
    let selectedCol = 0;
    let isSearchFocused = false; // 搜索框聚焦状态

    // 重命名状态
    let isRenaming = false;
    let renamingFileId = null;

    let files = [];
    let editingFile = null;
    let editorContent = '';

    let modalVisible = false;
    let modalIconText = '';
    let modalTitleText = '';
    let modalMessageText = '';
    let modalButtonDefs = [];
    let modalSelectedBtnIdx = 0;

    let showCreateMenuVisible = false;
    let createMenuSelectedIdx = 0;

    // Find & Replace state
    let findBarVisible = false;
    let showReplaceMode = false;
    let findMatches = [];
    let findCurrentIdx = -1;
    let lastSearchQuery = '';

    const PROGRAM_FOLDER = 'FastTXT_Data';
    const TRASH_DIR = '.trash';
    const ORDER_FILE = '.order.json';
    const GRID_COLS = 3; // 文件列表网格列数

    // ========== Computed ==========
    const getActiveFiles = () => files.filter(f => !f.deleted).sort((a, b) => a.order - b.order);
    const getDeletedFiles = () => files.filter(f => f.deleted);

    // Grid row helpers
    const getGridRow = (col) => Math.floor(col / GRID_COLS);
    const getGridRowCount = (total) => Math.ceil(total / GRID_COLS);
    const getFirstInRow = (row) => row * GRID_COLS;
    const getLastInRow = (row, total) => Math.min((row + 1) * GRID_COLS - 1, total - 1);
    const isInFirstRow = (col) => col < GRID_COLS;
    const isInLastRow = (col, total) => col >= (getGridRowCount(total) - 1) * GRID_COLS;

    // 获取当前目录下的文件
    const getFilesInCurrentFolder = () => {
      return getActiveFiles().filter(f => {
        const parent = f.parentPath || '';
        return parent === currentFolderPath;
      });
    };

    const getDisplayFiles = () => {
      let base;
      if (isTrashMode) {
        base = getDeletedFiles();
      } else if (isFolderMode) {
        base = getFilesInCurrentFolder();
      } else {
        base = getActiveFiles();
      }
      if (!searchQuery) return base;
      const q = searchQuery.toLowerCase();
      return base.filter(f => f.name.toLowerCase().includes(q));
    };
    const getLineCount = () => editorContent.split('\n').length;

    const getFooterButtons = () => {
      const btns = [
        { id: 'add', icon: '+', action: showCreateMenu, title: 'Create new' },
        { id: 'trash', icon: '🗑️', action: toggleTrashMode, title: isTrashMode ? 'Back to files' : 'Show deleted' },
        { id: 'folder', icon: '📁', action: openFolder, title: 'Open in Explorer' },
      ];
      if (isTrashMode) {
        btns.push({ id: 'shredder', icon: '⚙️', action: showShredConfirm, title: 'Shred all' });
      }
      return btns;
    };

    // ========== File System Helpers ==========
    const fsAPI = () => window.hundun && window.hundun.fs ? window.hundun.fs : null;

    const getFileInfoFromName = (name) => {
      const ext = name.substring(name.lastIndexOf('.')).toLowerCase();
      return {
        isText: ext === '.txt' || ext === '.md',
        isMarkdown: ext === '.md'
      };
    };

    // ========== File Management (Disk-based) ==========
    const createDefaultFiles = async () => {
      const api = fsAPI();
      if (!api) return;

      // 检查是否已有文件
      const existing = await api.readDir('');
      if (existing.length > 0) return; // 已有文件，不创建默认

      // 创建默认文件
      await api.writeFile('readme.txt', 'Welcome to FastTXT!\n\nA retro text file manager.\n\nFeatures:\n- Drag & drop import\n- File editing\n- Trash & shred');
      await api.writeFile('notes.md', '# Notes\n\n## TODO\n- [ ] Try dragging files\n- [ ] Create new files\n- [ ] Test the shredder');
      await api.writeFile('draft.txt', 'This is a draft file.\n\nYou can edit this text freely.');
    };

    const loadFilesFromDisk = async () => {
      // 编辑器打开时禁止重建 files[]，避免 editingFile 变成孤儿引用
      if (currentView === 'editor') return;

      const api = fsAPI();
      if (!api) { files = []; return; }

      // 读取排序信息
      let orderMap = {};
      try {
        const orderJson = await api.readFile(ORDER_FILE);
        if (orderJson) {
          const parsed = JSON.parse(orderJson);
          if (parsed && Array.isArray(parsed.ids)) {
            parsed.ids.forEach((id, idx) => { orderMap[id] = idx; });
          }
        }
      } catch (_) {}

      // 读取正常目录
      const activeEntries = await api.readDir('');
      // 读取回收站
      const trashEntries = await api.readDir(TRASH_DIR);

      const newFiles = [];
      let maxOrder = 0;

      // 处理正常文件（root + 每个文件夹内部）
      for (const entry of activeEntries) {
        if (entry.name === ORDER_FILE || entry.name === TRASH_DIR) continue;
        if (entry.name.startsWith('.')) continue;

        const id = entry.name;
        const order = orderMap[id] !== undefined ? orderMap[id] : maxOrder++;
        if (order >= maxOrder) maxOrder = order + 1;

        if (entry.isDirectory) {
          newFiles.push({
            id: id,
            name: id,
            content: '',
            deleted: false,
            order: order,
            isFolder: true,
            parentPath: ''  // 文件夹在根目录
          });
          // 读取文件夹内部的文件
          try {
            const subEntries = await api.readDir(id);
            for (const sub of subEntries) {
              if (sub.name.startsWith('.')) continue;
              const subId = `${id}/${sub.name}`;
              const subOrder = orderMap[subId] !== undefined ? orderMap[subId] : maxOrder++;
              if (subOrder >= maxOrder) maxOrder = subOrder + 1;
              newFiles.push({
                id: subId,
                name: sub.name,
                content: null,
                deleted: false,
                order: subOrder,
                isFolder: sub.isDirectory,
                parentPath: id
              });
            }
          } catch (_) {}
        } else {
          // 根目录文件
          newFiles.push({
            id: id,
            name: id,
            content: null,
            deleted: false,
            order: order,
            isFolder: false,
            parentPath: ''
          });
        }
      }

      // 处理回收站文件
      for (const entry of trashEntries) {
        if (entry.name.startsWith('.')) continue;
        const id = entry.name;
        const order = orderMap[id] !== undefined ? orderMap[id] : maxOrder++;
        if (order >= maxOrder) maxOrder = order + 1;

        if (entry.isDirectory) {
          newFiles.push({
            id: id,
            name: id,
            content: '',
            deleted: true,
            order: order,
            isFolder: true
          });
        } else {
          newFiles.push({
            id: id,
            name: id,
            content: null,
            deleted: true,
            order: order,
            isFolder: false
          });
        }
      }

      // 按 orderMap 中不存在的排在最后
      newFiles.sort((a, b) => a.order - b.order);
      files = newFiles;
    };

    const saveOrderToDisk = async () => {
      const api = fsAPI();
      if (!api) return;
      const active = getActiveFiles();
      const deleted = getDeletedFiles();
      const allSorted = [...active, ...deleted];
      const ids = allSorted.map(f => f.id);
      await api.writeFile(ORDER_FILE, JSON.stringify({ ids }, null, 2));
    };

    const saveFiles = async () => {
      await saveOrderToDisk();
    };

    // ========== UI Render ==========
    const updateUI = () => {
      if (currentView === 'main') {
        viewMain.style.display = '';
        viewEditor.style.display = 'none';
        // Close find bar when leaving editor
        if (findBarVisible) {
          findBarVisible = false;
          findBar.style.display = 'none';
        }
        // 面包屑
        if (isFolderMode) {
          folderBreadcrumb.style.display = '';
          breadcrumbPath.textContent = `📁 ${currentFolderPath}`;
        } else {
          folderBreadcrumb.style.display = 'none';
        }
        // 搜索框聚焦视觉状态
        document.querySelector('.ftxt-search').classList.toggle('search-focused', isSearchFocused);
        renderFileList();
        renderFooter();
        updateFooterInfo();
        updateTrashShredderZones();
      } else if (currentView === 'editor') {
        viewMain.style.display = 'none';
        viewEditor.style.display = '';
        renderEditorStatus();
        renderLineNumbers();
      }
      clampSelection();
    };

    const renderFileList = () => {
      const list = getDisplayFiles();

      // 重命名中不重建 DOM（保留 input 元素）
      if (isRenaming) {
        updateFileListSelection(list);
        return;
      }

      // 如果文件数量变了，才重建 DOM
      const existingCards = fileList.querySelectorAll('.ftxt-file-card');
      if (existingCards.length !== list.length) {
        rebuildFileListDOM(list);
      } else {
        // 只更新选中状态和内容
        updateFileListSelection(list);
      }
    };

    const rebuildFileListDOM = (list) => {
      fileList.innerHTML = '';

      if (list.length === 0) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'ftxt-empty';
        emptyDiv.innerHTML = `
          <div class="empty-icon">📁</div>
          <div class="empty-text">${isTrashMode ? 'Trash is empty' : isFolderMode ? `No files in ${currentFolderPath}` : 'No files yet'}</div>
          <div class="empty-hint">${isTrashMode || isFolderMode ? '' : 'Drag .txt or .md files here'}</div>
        `;
        fileList.appendChild(emptyDiv);
        return;
      }

      list.forEach((file, idx) => {
        const card = document.createElement('div');
        card.className = 'ftxt-file-card';
        if (selectedRow === 0 && selectedCol === idx && !isSearchFocused) card.classList.add('selected');
        if (dragFileId === file.id) card.classList.add('dragging');
        if (file.deleted) card.classList.add('is-deleted');
        card.draggable = true;
        card.dataset.fileId = file.id;

        let icon = '📄';
        if (file.isFolder) icon = '📁';
        else if (file.name.endsWith('.md')) icon = '📝';
        card.innerHTML = `
          <div class="file-icon">${icon}</div>
          <div class="file-info">
            <div class="file-name">${escapeHtml(file.name)}</div>
          </div>
          ${file.deleted ? '<div class="file-deleted-badge">DELETED</div>' : ''}
          <button class="file-rename-btn" title="Rename (M)">✎</button>
        `;

        card.addEventListener('dragstart', (e) => handleFileDragStart(e, file));
        card.addEventListener('dragend', handleFileDragEnd);
        card.addEventListener('click', () => handleFileClick(file));
        // 双击文件名 → 重命名
        card.addEventListener('dblclick', (e) => {
          e.preventDefault();
          if (!isTrashMode && !file.isFolder) {
            startRename(file);
          }
        });
        // 重命名按钮
        const renameBtn = card.querySelector('.file-rename-btn');
        if (renameBtn) {
          renameBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!isTrashMode) startRename(file);
          });
        }

        fileList.appendChild(card);
      });
    };

    const updateFileListSelection = (list) => {
      const cards = fileList.querySelectorAll('.ftxt-file-card');
      cards.forEach((card, idx) => {
        const file = list[idx];
        if (!file) return;

        // 更新选中状态（只在状态变化时改 class，避免抖动）
        const isSelected = selectedRow === 0 && selectedCol === idx && !isSearchFocused;
        const wasSelected = card.classList.contains('selected');
        if (isSelected !== wasSelected) {
          card.classList.toggle('selected', isSelected);
        }

        const isDragging = dragFileId === file.id;
        const wasDragging = card.classList.contains('dragging');
        if (isDragging !== wasDragging) {
          card.classList.toggle('dragging', isDragging);
        }

        const isDeleted = file.deleted;
        const wasDeleted = card.classList.contains('is-deleted');
        if (isDeleted !== wasDeleted) {
          card.classList.toggle('is-deleted', isDeleted);
        }

        // 更新文件名（以防万一）—— 重命名中跳过
        const nameEl = card.querySelector('.file-name');
        if (nameEl && nameEl.textContent !== file.name && !(isRenaming && renamingFileId === file.id)) {
          nameEl.textContent = file.name;
        }
      });
    };

    const renderFooter = () => {
      const btns = getFooterButtons();

      // 如果按钮数量变了，重建 DOM
      const existingBtns = footerButtons.querySelectorAll('.footer-btn');
      if (existingBtns.length !== btns.length) {
        rebuildFooterDOM(btns);
      } else {
        // 只更新选中状态
        updateFooterSelection(btns);
      }
    };

    const rebuildFooterDOM = (btns) => {
      footerButtons.innerHTML = '';

      btns.forEach((btn, idx) => {
        const el = document.createElement('button');
        el.className = 'footer-btn ' + btn.id + '-btn';
        if (btn.id === 'trash' && isTrashMode) el.classList.add('active');
        if (selectedRow === 1 && selectedCol === idx) el.classList.add('btn-focused');
        el.title = btn.title;
        el.innerHTML = `<span class="btn-icon">${btn.icon}</span>`;
        el.addEventListener('click', () => {
          isSearchFocused = false;
          selectedRow = 1;
          selectedCol = idx;
          btn.action();
          updateUI();
        });
        footerButtons.appendChild(el);
      });
    };

    const updateFooterSelection = (btns) => {
      const elements = footerButtons.querySelectorAll('.footer-btn');
      elements.forEach((el, idx) => {
        const btn = btns[idx];
        if (!btn) return;
        const isFocused = selectedRow === 1 && selectedCol === idx;
        const wasFocused = el.classList.contains('btn-focused');
        if (isFocused !== wasFocused) {
          el.classList.toggle('btn-focused', isFocused);
        }
        const isActive = (btn.id === 'trash' && isTrashMode) || (btn.id === 'folder' && isFolderMode);
        const wasActive = el.classList.contains('active');
        if (isActive !== wasActive) {
          el.classList.toggle('active', isActive);
        }
      });
    };

    const updateFooterInfo = () => {
      const active = getActiveFiles();
      const deleted = getDeletedFiles();
      if (isTrashMode) {
        fileCountEl.textContent = `${deleted.length} deleted`;
        trashCountEl.style.display = 'none';
      } else if (isFolderMode) {
        const inFolder = getFilesInCurrentFolder();
        fileCountEl.textContent = `${inFolder.length} files in ${currentFolderPath}`;
        trashCountEl.style.display = 'none';
      } else {
        fileCountEl.textContent = `${active.length} files`;
        trashCountEl.style.display = 'none';
      }
    };

    const updateTrashShredderZones = () => {
      trashZone.style.display = (isTrashMode || isFolderMode) ? 'none' : '';
      shredderZone.style.display = isTrashMode ? '' : 'none';
    };

    const renderLineNumbers = () => {
      const count = getLineCount();
      const lineHeight = editorFontSize * 1.8;
      lineNumbers.innerHTML = '';
      for (let n = 1; n <= count; n++) {
        const div = document.createElement('div');
        div.className = 'line-num';
        div.textContent = n;
        div.style.lineHeight = lineHeight + 'px';
        div.style.height = lineHeight + 'px';
        lineNumbers.appendChild(div);
      }
    };

    const renderEditorStatus = () => {
      statusLines.textContent = `Lines: ${getLineCount()}`;
      statusChars.textContent = `Chars: ${editorContent.length}`;
      // Word count
      const words = editorContent.trim() ? editorContent.trim().split(/\s+/).length : 0;
      statusWords.textContent = `Words: ${words}`;
      statusType.textContent = editingFile && editingFile.name.endsWith('.md') ? 'Markdown' : 'Plain Text';
    };

    const escapeHtml = (str) => str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    // ========== Selection Clamping ==========
    const clampSelection = () => {
      if (currentView === 'main') {
        const list = getDisplayFiles();
        if (isSearchFocused) {
          // 搜索框聚焦时不需要clamp文件列表
          return;
        }
        if (list.length === 0) {
          selectedCol = 0;
        } else if (selectedCol >= list.length) {
          selectedCol = list.length - 1;
        }
        if (selectedCol < 0) selectedCol = 0;
        if (selectedRow === 1) {
          const btns = getFooterButtons();
          if (selectedCol >= btns.length) selectedCol = btns.length - 1;
        }
      }
    };

    // ========== File Operations ==========
    const handleFileClick = (file) => {
      playSound('click');
      isSearchFocused = false;
      const list = getDisplayFiles();
      const idx = list.findIndex(f => f.id === file.id);

      // 已经选中了这个文件 → 打开
      if (selectedRow === 0 && selectedCol === idx) {
        openFile(file);
        return;
      }

      // 没选中 → 选中它
      selectedRow = 0;
      selectedCol = idx;
      updateUI();
    };

    // ========== Rename ==========
    const startRename = (file) => {
      if (isRenaming) return;
      // 文件夹暂不支持重命名
      if (file.isFolder) return;
      playSound('click');

      isRenaming = true;
      renamingFileId = file.id;

      const list = getDisplayFiles();
      const idx = list.findIndex(f => f.id === file.id);
      const cards = fileList.querySelectorAll('.ftxt-file-card');
      const card = cards[idx];
      if (!card) { isRenaming = false; return; }

      const nameEl = card.querySelector('.file-name');
      if (!nameEl) { isRenaming = false; return; }

      // 创建 input 元素
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'file-rename-input';
      input.value = file.name;

      // 替换文件名文本为 input
      nameEl.textContent = '';
      nameEl.appendChild(input);
      input.focus();
      input.select();

      // Enter → 确认, Esc → 取消, 失焦 → 确认
      input.addEventListener('keydown', (e) => {
        e.stopPropagation();
        if (e.key === 'Enter') {
          e.preventDefault();
          confirmRename(file, input.value);
        } else if (e.key === 'Escape') {
          e.preventDefault();
          cancelRename(file);
        } else if (e.key === 'Tab') {
          // Tab → 确认当前，重命名下一个
          e.preventDefault();
          confirmRename(file, input.value).then(() => {
            const nextIdx = idx + 1;
            const nextList = getDisplayFiles();
            if (nextIdx < nextList.length) {
              selectedCol = nextIdx;
              updateUI();
              startRename(nextList[nextIdx]);
            }
          });
        }
      });

      input.addEventListener('blur', () => {
        // 延迟处理，避免与 click 事件冲突
        setTimeout(() => {
          if (isRenaming && renamingFileId === file.id) {
            confirmRename(file, input.value);
          }
        }, 100);
      });

      // 阻止点击 input 时的文件选中逻辑
      input.addEventListener('click', (e) => e.stopPropagation());
    };

    const confirmRename = async (file, newName) => {
      if (!isRenaming) return;
      isRenaming = false;
      renamingFileId = null;

      newName = newName.trim();

      // 空名 → 取消
      if (!newName || newName === file.name) {
        cancelRename(file);
        return;
      }

      // 检查重名（同目录下不能有同名文件）
      const currentFiles = file.parentPath
        ? files.filter(f => !f.deleted && f.parentPath === file.parentPath && f.id !== file.id)
        : files.filter(f => !f.deleted && !f.parentPath && f.id !== file.id);
      const duplicate = currentFiles.some(f => f.name === newName);
      if (duplicate) {
        showModal('⚠️', 'RENAME FAILED', `A file named "${newName}" already exists`, [
          { text: 'OK', class: 'primary', action: closeModal }
        ]);
        cancelRename(file);
        return;
      }

      const api = fsAPI();
      if (api) {
        const oldPath = file.parentPath ? `${file.parentPath}/${file.name}` : file.name;
        const newPath = file.parentPath ? `${file.parentPath}/${newName}` : newName;
        await api.rename(oldPath, newPath);
      }

      // 更新文件对象
      const oldId = file.id;
      file.name = newName;
      file.id = file.parentPath ? `${file.parentPath}/${newName}` : newName;
      // content 缓存清空，下次打开时从磁盘重新读取
      file.content = null;

      await saveFiles();
      playSound('OK');
      updateUI();
    };

    const cancelRename = (file) => {
      isRenaming = false;
      renamingFileId = null;
      // 恢复文件名显示
      const list = getDisplayFiles();
      const idx = list.findIndex(f => f.id === file.id);
      const cards = fileList.querySelectorAll('.ftxt-file-card');
      const card = cards[idx];
      if (card) {
        const nameEl = card.querySelector('.file-name');
        if (nameEl) {
          // 移除 input，恢复原始文本
          const input = nameEl.querySelector('.file-rename-input');
          if (input) {
            nameEl.removeChild(input);
          }
          nameEl.textContent = file.name;
        }
      }
      playSound('click');
    };

    const openFile = async (file) => {
      if (file.deleted) {
        restoreFile(file);
        return;
      }

      // 文件夹 → 进入文件夹
      if (file.isFolder) {
        enterFolder(file);
        return;
      }

      const api = fsAPI();
      if (!api) return;

      // 始终从磁盘读取最新内容（不信任缓存，防止旧数据覆盖新编辑）
      const subPath = file.parentPath ? `${file.parentPath}/${file.name}` : file.name;
      const diskContent = await api.readFile(subPath);
      file.content = diskContent !== null ? diskContent : '';
      editorContent = file.content;

      playSound('OK');
      editingFile = file;
      currentView = 'editor';
      // 更新编辑器标题
      editorTitle.textContent = file.name;
      editorIcon.textContent = file.name.endsWith('.md') ? '📝' : '📄';
      // Reset find bar state
      findBarVisible = false;
      findBar.style.display = 'none';
      findMatches = [];
      findCurrentIdx = -1;
      updateUI();
      // 立即将内容写入 textarea（避免异步时序导致空内容覆盖磁盘数据）
      editorTextarea.value = editorContent;
      renderEditorStatus();
      renderLineNumbers();
      setTimeout(() => editorTextarea.focus(), 0);
    };

    const restoreFile = (file) => {
      playSound('click');
      const api = fsAPI();
      if (api) {
        // 从回收站移动回来
        const trashName = file.name.includes('/') ? file.name.split('/').pop() : file.name;
        api.rename(`${TRASH_DIR}/${trashName}`, file.name);
      }
      file.deleted = false;
      saveFiles();
      updateUI();
    };

    const closeEditor = async () => {
      // Close find bar if open
      if (findBarVisible) {
        closeFindBar();
      }
      if (editingFile) {
        const api = fsAPI();
        const newContent = editorContent;
        editingFile.content = newContent;
        // 写入磁盘（使用完整路径）
        if (api) {
          const subPath = editingFile.parentPath ? `${editingFile.parentPath}/${editingFile.name}` : editingFile.name;
          await api.writeFile(subPath, newContent);
        }
        saveFiles();
      }
      playSound('exit');
      currentView = 'main';
      editingFile = null;
      updateUI();
    };

    // ========== External File Import ==========
    const handleGlobalDrop = (e) => {
      e.preventDefault();
      const droppedFiles = e.dataTransfer && e.dataTransfer.files;
      if (!droppedFiles || droppedFiles.length === 0) return;

      for (let i = 0; i < droppedFiles.length; i++) {
        const f = droppedFiles[i];
        const name = f.name.toLowerCase();
        if (name.endsWith('.txt') || name.endsWith('.md')) {
          importFile(f, f.path);
        }
      }
    };

    const importFile = (file, originalPath) => {
      const reader = new FileReader();
      reader.onload = async (e) => {
        const content = e.target.result;
        const api = fsAPI();
        const subPath = isFolderMode ? `${currentFolderPath}/${file.name}` : file.name;
        if (api) {
          // 写入磁盘
          await api.writeFile(subPath, content);
          // 刷新文件列表
          await loadFilesFromDisk();
        } else {
          // fallback: 内存
          const id = isFolderMode ? `${currentFolderPath}/${file.name}` : file.name;
          const newFile = {
            id: id,
            name: file.name,
            content: content,
            deleted: false,
            order: files.length,
            isFolder: false,
            parentPath: currentFolderPath
          };
          files.push(newFile);
        }
        // 导入成功后删除原始文件
        if (originalPath) {
          try {
            require('fs').unlinkSync(originalPath);
          } catch (err) {
            console.warn('[FastTXT] 删除原始文件失败:', err.message);
          }
        }
        saveFiles();
        playSound('OK');
        updateUI();
      };
      reader.readAsText(file);
    };

    // ========== File Drag & Reorder ==========
    const handleFileDragStart = (e, file) => {
      // 拖拽时取消正在进行的重命名
      if (isRenaming) {
        const renamingFile = files.find(f => f.id === renamingFileId);
        if (renamingFile) cancelRename(renamingFile);
      }
      dragFileId = file.id;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', file.id);
      updateUI();
    };

    const handleFileDragEnd = () => {
      dragFileId = null;
      updateUI();
    };

    const handleListDragOver = (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    };

    const handleListDrop = (e) => {
      e.preventDefault();
      const fileId = e.dataTransfer.getData('text/plain');
      if (!fileId) return;

      const file = files.find(f => f.id === fileId);
      if (!file) return;

      const cards = fileList.querySelectorAll('.ftxt-file-card');
      let newOrder = 0;

      for (let i = 0; i < cards.length; i++) {
        const rect = cards[i].getBoundingClientRect();
        const midY = rect.top + rect.height / 2;
        if (e.clientY > midY) {
          newOrder = i + 1;
        }
      }

      const active = getActiveFiles().filter(f => f.id !== fileId);
      active.splice(newOrder, 0, file);
      active.forEach((f, i) => f.order = i);

      saveFiles();
      playSound('click');
      // 强制重建文件列表DOM，确保排序后内容顺序正确
      fileList.innerHTML = '';
      updateUI();
    };

    // ========== Trash Operations ==========
    const toggleTrashMode = () => {
      playSound('click');
      isTrashMode = !isTrashMode;
      isFolderMode = false;
      currentFolderPath = '';
      selectedRow = 0;
      selectedCol = 0;
      isSearchFocused = false;
      searchQuery = '';
      searchInput.value = '';
      searchInput.blur();
      updateUI();
    };

    // ========== Folder Operations ==========
    const enterFolder = (folderFile) => {
      playSound('click');
      isFolderMode = true;
      isTrashMode = false;
      currentFolderPath = folderFile.name;
      selectedRow = 0;
      selectedCol = 0;
      isSearchFocused = false;
      searchQuery = '';
      searchInput.value = '';
      searchInput.blur();
      updateUI();
    };

    const enterFolderFromSelection = () => {
      const list = getDisplayFiles();
      const file = list[selectedCol];
      if (file && file.isFolder) {
        enterFolder(file);
      }
    };

    const exitFolderMode = () => {
      playSound('click');
      isFolderMode = false;
      currentFolderPath = '';
      selectedRow = 0;
      selectedCol = 0;
      isSearchFocused = false;
      searchQuery = '';
      searchInput.value = '';
      searchInput.blur();
      updateUI();
    };

    const handleTrashDrop = async (e) => {
      e.preventDefault();
      isTrashDragOver = false;
      trashZone.classList.remove('drag-over');
      const fileId = e.dataTransfer.getData('text/plain');
      if (!fileId) return;

      const file = files.find(f => f.id === fileId);
      if (file && !file.deleted) {
        const api = fsAPI();
        if (api) {
          // 确保 .trash 目录存在
          await api.mkdir(TRASH_DIR);
          // 移动文件到回收站
          const srcPath = file.parentPath ? `${file.parentPath}/${file.name}` : file.name;
          const trashPath = `${TRASH_DIR}/${file.name}`;
          await api.rename(srcPath, trashPath);
        }
        file.deleted = true;
        saveFiles();
        playSound('exit');
        updateUI();
      }
    };

    const handleShredderDrop = async (e) => {
      e.preventDefault();
      isShredderDragOver = false;
      shredderZone.classList.remove('drag-over');
      const fileId = e.dataTransfer.getData('text/plain');
      if (!fileId) return;

      const file = files.find(f => f.id === fileId);
      if (file && file.deleted) {
        const api = fsAPI();
        if (api) {
          // 从磁盘永久删除
          await api.deleteFile(`${TRASH_DIR}/${file.name}`);
        }
        const idx = files.findIndex(f => f.id === fileId);
        if (idx !== -1) {
          files.splice(idx, 1);
          saveFiles();
          playSound('error');
          updateUI();
        }
      }
    };

    // ========== Shredder Operation ==========
    const showShredConfirm = () => {
      if (getDeletedFiles().length === 0) {
        showModal('📭', 'EMPTY TRASH', 'No files to shred', [
          { text: 'OK', class: 'primary', action: closeModal }
        ]);
        return;
      }

      showModal('⚙️', 'SHRED ALL?', `Permanently delete ${getDeletedFiles().length} file(s)?`, [
        { text: 'Cancel', class: 'secondary', action: closeModal },
        { text: '⚙️ Shred All', class: 'danger', action: shredAll }
      ]);
    };

    const shredAll = async () => {
      const api = fsAPI();
      if (api) {
        // 从磁盘永久删除回收站中所有文件
        const deleted = getDeletedFiles();
        for (const file of deleted) {
          await api.deleteFile(`${TRASH_DIR}/${file.name}`);
        }
      }
      files = files.filter(f => !f.deleted);
      saveFiles();
      closeModal();
      playSound('error');
      updateUI();
    };

    const openFolder = async () => {
      playSound('click');
      try {
        // 优先用 preload 提供的 API（通过主进程 shell.openPath）
        if (window.hundun && window.hundun.fs && window.hundun.fs.openInExplorer) {
          await window.hundun.fs.openInExplorer();
          return;
        }
      } catch (e) {
        console.warn('[FastTXT] preload openInExplorer failed, trying fallback:', e);
      }
      // fallback: 直接用 Electron shell（需要 nodeIntegration: true）
      try {
        const { shell } = require('electron');
        const filePath = decodeURIComponent(window.location.pathname);
        const dirPath = filePath.replace(/^\/?([A-Z]:)/, '$1').replace(/\/index\.html$/, '');
        shell.openPath(dirPath);
      } catch (e) {
        console.error('[FastTXT] openFolder fallback error:', e);
      }
    };

    // ========== 重名检测 ==========
    const getUniqueName = (baseName, ext) => {
      const currentFiles = isFolderMode
        ? files.filter(f => !f.deleted && f.parentPath === currentFolderPath)
        : files.filter(f => !f.deleted && !f.parentPath);
      const existingNames = new Set(currentFiles.map(f => f.name));

      let candidate = baseName + ext;
      if (!existingNames.has(candidate)) return candidate;
      return baseName + '1' + ext;
    };

    // ========== Create File / Folder ==========
    const showCreateMenu = () => {
      playSound('click');
      createMenuSelectedIdx = 0;
      showCreateMenuVisible = true;
      renderCreateMenu();
    };

    const closeCreateMenu = () => {
      showCreateMenuVisible = false;
      createMenuOverlay.style.display = 'none';
    };

    const renderCreateMenu = () => {
      if (!showCreateMenuVisible) return;
      createMenuOverlay.style.display = '';
      const options = createOptions.querySelectorAll('.create-option');
      options.forEach((opt, idx) => {
        opt.classList.toggle('btn-selected', idx === createMenuSelectedIdx);
      });
    };

    const createFile = async (type) => {
      closeCreateMenu();
      const ext = type === 'txt' ? '.txt' : '.md';
      const baseName = `new_file`;
      const name = getUniqueName(baseName, ext);
      const api = fsAPI();
      const subPath = isFolderMode ? `${currentFolderPath}/${name}` : name;
      if (api) {
        await api.writeFile(subPath, '');
        await loadFilesFromDisk();
      } else {
        const id = isFolderMode ? `${currentFolderPath}/${name}` : name;
        const newFile = {
          id: id,
          name: name,
          content: '',
          deleted: false,
          order: files.length,
          isFolder: false,
          parentPath: currentFolderPath
        };
        files.push(newFile);
      }
      saveFiles();
      playSound('OK');
      // 找到刚创建的文件并打开编辑
      const newFile = files.find(f => f.name === name);
      if (newFile) {
        editingFile = newFile;
        editorContent = '';
        currentView = 'editor';
        updateUI();
        setTimeout(() => editorTextarea.focus(), 0);
      } else {
        updateUI();
      }
    };

    const createFolder = async () => {
      closeCreateMenu();
      const api = fsAPI();
      const folderName = getUniqueName('NewFolder', '');
      const subPath = isFolderMode ? `${currentFolderPath}/${folderName}` : folderName;
      if (api) {
        await api.mkdir(subPath);
        await loadFilesFromDisk();
      } else {
        const id = isFolderMode ? `${currentFolderPath}/${folderName}` : folderName;
        const newFolder = {
          id: id,
          name: folderName,
          content: '',
          isFolder: true,
          deleted: false,
          order: files.length,
          parentPath: currentFolderPath
        };
        files.push(newFolder);
      }
      saveFiles();
      playSound('OK');
      updateUI();
    };

    // ========== Find & Replace ==========
    const openFindBar = (withReplace) => {
      playSound('click');
      findBarVisible = true;
      showReplaceMode = withReplace;
      findBar.style.display = '';
      replaceRow.style.display = withReplace ? '' : 'none';
      findInput.value = '';
      replaceInput.value = '';
      findMatches = [];
      findCurrentIdx = -1;
      lastSearchQuery = '';
      findCount.textContent = '0/0';
      setTimeout(() => findInput.focus(), 0);
    };

    const closeFindBar = () => {
      playSound('click');
      findBarVisible = false;
      findBar.style.display = 'none';
      clearFindHighlights();
      setTimeout(() => editorTextarea.focus(), 0);
    };

    const clearFindHighlights = () => {
      // Clear any visual highlights (we track matches in JS)
      findMatches = [];
      findCurrentIdx = -1;
      findCount.textContent = '0/0';
    };

    const performFind = () => {
      const query = findInput.value;
      if (!query) {
        clearFindHighlights();
        return;
      }

      findMatches = [];
      const content = editorContent;
      const lowerContent = content.toLowerCase();
      const lowerQuery = query.toLowerCase();
      let pos = 0;

      while (pos < content.length) {
        const idx = lowerContent.indexOf(lowerQuery, pos);
        if (idx === -1) break;
        findMatches.push({ start: idx, end: idx + query.length });
        pos = idx + 1;
      }

      if (findMatches.length > 0) {
        // Find the match closest to cursor position
        const cursorPos = editorTextarea.selectionStart;
        findCurrentIdx = 0;
        for (let i = 0; i < findMatches.length; i++) {
          if (findMatches[i].start >= cursorPos) {
            findCurrentIdx = i;
            break;
          }
        }
      } else {
        findCurrentIdx = -1;
      }

      lastSearchQuery = query;
      updateFindCount();
      scrollToFindMatch();
    };

    const updateFindCount = () => {
      if (findMatches.length === 0) {
        findCount.textContent = findInput.value ? '0/0' : '0/0';
        findCount.style.color = findInput.value ? 'var(--accent-secondary, #ff0080)' : '';
      } else {
        findCount.textContent = `${findCurrentIdx + 1}/${findMatches.length}`;
        findCount.style.color = '';
      }
    };

    const scrollToFindMatch = () => {
      if (findCurrentIdx < 0 || findCurrentIdx >= findMatches.length) return;
      const match = findMatches[findCurrentIdx];
      editorTextarea.focus();
      editorTextarea.setSelectionRange(match.start, match.end);

      // Scroll the textarea to show the match
      const linesBefore = editorContent.substring(0, match.start).split('\n').length - 1;
      const lineHeight = parseFloat(getComputedStyle(editorTextarea).lineHeight) || 23.4;
      const scrollTarget = linesBefore * lineHeight - editorTextarea.clientHeight / 3;
      editorTextarea.scrollTop = Math.max(0, scrollTarget);
    };

    const findNext = () => {
      if (findMatches.length === 0) return;
      findCurrentIdx = (findCurrentIdx + 1) % findMatches.length;
      updateFindCount();
      scrollToFindMatch();
      playSound('click');
    };

    const findPrev = () => {
      if (findMatches.length === 0) return;
      findCurrentIdx = (findCurrentIdx - 1 + findMatches.length) % findMatches.length;
      updateFindCount();
      scrollToFindMatch();
      playSound('click');
    };

    const replaceOne = () => {
      if (findCurrentIdx < 0 || findCurrentIdx >= findMatches.length) return;
      const match = findMatches[findCurrentIdx];
      const replacement = replaceInput.value;
      const before = editorContent.substring(0, match.start);
      const after = editorContent.substring(match.end);
      editorContent = before + replacement + after;
      editorTextarea.value = editorContent;
      renderEditorStatus();
      renderLineNumbers();
      performFind(); // Re-search after replacement
      playSound('click');
    };

    const replaceAll = () => {
      if (findMatches.length === 0) return;
      const query = findInput.value;
      const replacement = replaceInput.value;
      const count = findMatches.length;

      // Replace from end to start to preserve indices
      let newContent = editorContent;
      const lowerContent = newContent.toLowerCase();
      const lowerQuery = query.toLowerCase();

      // Build new content by replacing all occurrences
      let result = '';
      let pos = 0;
      while (pos < newContent.length) {
        const idx = lowerContent.indexOf(lowerQuery, pos);
        if (idx === -1) {
          result += newContent.substring(pos);
          break;
        }
        result += newContent.substring(pos, idx) + replacement;
        pos = idx + query.length;
      }

      editorContent = result;
      editorTextarea.value = editorContent;
      renderEditorStatus();
      renderLineNumbers();
      performFind(); // Re-search
      playSound('OK');
    };

    // ========== Auto-save ==========
    const saveEditorContent = async () => {
      if (!editingFile) return;
      const api = fsAPI();
      if (api) {
        const subPath = editingFile.parentPath ? `${editingFile.parentPath}/${editingFile.name}` : editingFile.name;
        await api.writeFile(subPath, editorContent);
      }
      editingFile.content = editorContent;
      await saveFiles();
    };

    const showAutoSaveIndicator = () => {
      autoSaveIndicator.style.display = '';
      // Reset animation
      autoSaveIndicator.style.animation = 'none';
      autoSaveIndicator.offsetHeight; // Trigger reflow
      autoSaveIndicator.style.animation = '';
      setTimeout(() => {
        autoSaveIndicator.style.display = 'none';
      }, 1500);
    };

    // ========== Modal ==========
    const showModal = (icon, title, message, buttons) => {
      modalIconText = icon;
      modalTitleText = title;
      modalMessageText = message;
      modalButtonDefs = buttons;
      modalSelectedBtnIdx = 0;
      modalVisible = true;
      renderModal();
    };

    const closeModal = () => {
      modalVisible = false;
      modalOverlay.style.display = 'none';
    };

    const renderModal = () => {
      if (!modalVisible) return;
      modalOverlay.style.display = '';
      modalIcon.textContent = modalIconText;
      modalTitle.textContent = modalTitleText;
      modalMessage.textContent = modalMessageText;

      modalButtons.innerHTML = '';
      modalButtonDefs.forEach((btn, idx) => {
        const el = document.createElement('button');
        el.className = 'modal-btn';
        if (btn.class) el.className += ' ' + btn.class;
        if (idx === modalSelectedBtnIdx) el.className += ' btn-selected';
        el.textContent = btn.text;
        el.addEventListener('click', btn.action);
        modalButtons.appendChild(el);
      });
    };

    // ========== Editor Keydown ==========
    const handleEditorKeydown = (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = editorTextarea.selectionStart;
        const end = editorTextarea.selectionEnd;
        editorContent = editorContent.substring(0, start) + '  ' + editorContent.substring(end);
        editorTextarea.value = editorContent;
        editorTextarea.selectionStart = editorTextarea.selectionEnd = start + 2;
        renderEditorStatus();
        renderLineNumbers();
      }
      // Prevent Backspace from triggering browser back when at start
      if (e.key === 'Backspace' && editorTextarea.selectionStart === 0 && editorTextarea.selectionEnd === 0) {
        e.preventDefault();
      }
    };

    // ========== Global Keyboard ==========
    const handleKeydown = (e) => {
      let key = e.key;

      // Modal open - use original key, WASD works as arrows via mapping below
      if (modalVisible) {
        e.preventDefault();
        e.stopImmediatePropagation();
        // Map WASD to arrows for modal navigation
        if (key === 'w' || key === 'W') key = 'ArrowUp';
        if (key === 's' || key === 'S') key = 'ArrowDown';
        if (key === 'a' || key === 'A') key = 'ArrowLeft';
        if (key === 'd' || key === 'D') key = 'ArrowRight';
        if (key === 'Escape') {
          closeModal();
          playSound('click');
        } else if (key === 'ArrowUp' || key === 'ArrowDown' || key === 'ArrowLeft' || key === 'ArrowRight') {
          playSound('click');
          if (key === 'ArrowUp') {
            modalSelectedBtnIdx = modalButtonDefs.length - 1;
          } else if (key === 'ArrowDown') {
            modalSelectedBtnIdx = 0;
          } else if (key === 'ArrowLeft') {
            modalSelectedBtnIdx = Math.max(0, modalSelectedBtnIdx - 1);
          } else if (key === 'ArrowRight') {
            modalSelectedBtnIdx = Math.min(modalButtonDefs.length - 1, modalSelectedBtnIdx + 1);
          }
          renderModal();
        } else if (key === 'Enter' || key === ' ') {
          playSound('click');
          const btn = modalButtonDefs[modalSelectedBtnIdx];
          if (btn && btn.action) btn.action();
        }
        return;
      }

      // Create menu open
      if (showCreateMenuVisible) {
        e.preventDefault();
        e.stopImmediatePropagation();
        // Map WASD to arrows for create menu navigation
        if (key === 'w' || key === 'W') key = 'ArrowUp';
        if (key === 's' || key === 'S') key = 'ArrowDown';
        if (key === 'a' || key === 'A') key = 'ArrowLeft';
        if (key === 'd' || key === 'D') key = 'ArrowRight';
        const totalOpts = 3;
        if (key === 'Escape') {
          closeCreateMenu();
          playSound('click');
        } else if (key === 'ArrowUp' || key === 'ArrowDown') {
          playSound('click');
          if (key === 'ArrowUp') {
            createMenuSelectedIdx = (createMenuSelectedIdx + totalOpts - 1) % totalOpts;
          } else {
            createMenuSelectedIdx = (createMenuSelectedIdx + 1) % totalOpts;
          }
          renderCreateMenu();
        } else if (key === 'Enter' || key === ' ') {
          playSound('click');
          if (createMenuSelectedIdx === 0) createFile('txt');
          else if (createMenuSelectedIdx === 1) createFile('md');
          else if (createMenuSelectedIdx === 2) createFolder();
          else closeCreateMenu();
        }
        return;
      }

      // Rename mode - only F2 to re-trigger, Escape handled by input itself
      if (isRenaming) {
        return;
      }

      // Find/Replace bar open - let it handle its own keys
      if (findBarVisible) {
        return;
      }

      // Editor mode - only handle global shortcuts (Ctrl+S, Ctrl+F, etc.)
      if (currentView === 'editor') {
        // Ctrl/Cmd shortcuts
        if (e.ctrlKey || e.metaKey) {
          if (key === 's' || key === 'S') {
            e.preventDefault();
            e.stopImmediatePropagation();
            saveEditorContent();
            showAutoSaveIndicator();
            return;
          }
          if (key === 'f' || key === 'F') {
            e.preventDefault();
            e.stopImmediatePropagation();
            openFindBar(false);
            return;
          }
          if (key === 'h' || key === 'H') {
            e.preventDefault();
            e.stopImmediatePropagation();
            openFindBar(true);
            return;
          }
        }
        if (e.key === 'Escape') {
          e.preventDefault();
          e.stopImmediatePropagation();
          closeEditor();
        }
        return;
      }

      // Main view - WASD mapped to arrows for gamepad-style navigation
      let mappedKey = key;
      if (mappedKey === 'w' || mappedKey === 'W') mappedKey = 'ArrowUp';
      if (mappedKey === 's' || mappedKey === 'S') mappedKey = 'ArrowDown';
      if (mappedKey === 'a' || mappedKey === 'A') mappedKey = 'ArrowLeft';
      if (mappedKey === 'd' || mappedKey === 'D') mappedKey = 'ArrowRight';

      if (e.key === 'Escape') {
        if (isSearchFocused) {
          // 搜索框聚焦时 Escape → 清空搜索并取消聚焦
          isSearchFocused = false;
          searchInput.value = '';
          searchQuery = '';
          searchInput.blur();
          updateUI();
        } else if (isFolderMode) {
          // 文件夹模式 → 返回上一级（根目录）
          e.stopImmediatePropagation();
          exitFolderMode();
        } else if (isTrashMode) {
          // 回收站模式 → 返回文件列表
          e.stopImmediatePropagation();
          isTrashMode = false;
          playSound('exit');
          updateUI();
        } else {
          // 根目录 → 关闭子程序
          returnToParent();
        }
        return;
      }

      if (mappedKey === ' ') mappedKey = 'Enter';

      switch (mappedKey) {
        case 'ArrowUp':
          e.preventDefault();
          if (isSearchFocused) {
            // 搜索框已聚焦，不再上移
            break;
          } else if (selectedRow === 0) {
            // 文件网格中
            const list = getDisplayFiles();
            const total = list.length;
            if (total > 0 && isInFirstRow(selectedCol)) {
              // 在网格第一行 → 聚焦搜索框
              isSearchFocused = true;
              searchInput.focus();
              playSound('click');
              updateUI();
              break;
            }
            // 不在第一行 → 向上移动一行
            if (selectedCol >= GRID_COLS) {
              selectedCol -= GRID_COLS;
            }
          } else if (selectedRow === 1) {
            // 底部按钮行 → 回到最后一个文件
            selectedRow = 0;
            const btns = getFooterButtons();
            const lastFileCol = getDisplayFiles().length - 1;
            // 尝试对齐到按钮所在的列
            selectedCol = Math.min(selectedCol, lastFileCol);
          }
          playSound('click');
          updateUI();
          break;

        case 'ArrowDown':
          e.preventDefault();
          if (isSearchFocused) {
            // 搜索框聚焦 → 选中第一个文件
            isSearchFocused = false;
            searchInput.blur();
            selectedRow = 0;
            selectedCol = 0;
            playSound('click');
            updateUI();
            break;
          } else if (selectedRow === 0) {
            // 文件网格中
            const list = getDisplayFiles();
            const total = list.length;
            if (total === 0) break;
            if (isInLastRow(selectedCol, total)) {
              // 在网格最后一行 → 跳到底部按钮
              selectedRow = 1;
              const btns = getFooterButtons();
              selectedCol = Math.min(selectedCol, btns.length - 1);
            } else {
              // 向下移动一行，但不超过总数
              const next = selectedCol + GRID_COLS;
              selectedCol = Math.min(next, total - 1);
            }
          }
          playSound('click');
          updateUI();
          break;

        case 'ArrowLeft':
          e.preventDefault();
          if (!isSearchFocused) {
            if (selectedRow === 0 && selectedCol > 0) {
              selectedCol--;
            } else if (selectedRow === 1 && selectedCol > 0) {
              selectedCol--;
            }
          }
          playSound('click');
          updateUI();
          break;

        case 'ArrowRight':
          e.preventDefault();
          if (!isSearchFocused) {
            if (selectedRow === 0) {
              const maxFileCol = getDisplayFiles().length - 1;
              if (selectedCol < maxFileCol) selectedCol++;
            } else {
              const maxBtnCol = getFooterButtons().length - 1;
              if (selectedCol < maxBtnCol) selectedCol++;
            }
          }
          playSound('click');
          updateUI();
          break;

        case 'M':
        case 'm':
          e.preventDefault();
          if (selectedRow === 0 && !isTrashMode) {
            const file = getDisplayFiles()[selectedCol];
            if (file && !file.isFolder) startRename(file);
          }
          break;

        case 'Enter':
          e.preventDefault();
          if (isSearchFocused) {
            // 搜索框中按 Enter → 打开当前选中的文件（如果有的话）
            isSearchFocused = false;
            searchInput.blur();
            const list = getDisplayFiles();
            if (list.length > 0) {
              selectedRow = 0;
              openFile(list[selectedCol] || list[0]);
            }
          } else if (selectedRow === 0) {
            const file = getDisplayFiles()[selectedCol];
            if (file) openFile(file);
          } else {
            const btn = getFooterButtons()[selectedCol];
            if (btn) btn.action();
          }
          break;

        case 'Delete':
        case 'Backspace':
          e.preventDefault();
          if (!isSearchFocused && selectedRow === 0 && !isTrashMode) {
            const file = getDisplayFiles()[selectedCol];
            if (file && !file.deleted) {
              const api = fsAPI();
              if (api) {
                const srcPath = file.parentPath ? `${file.parentPath}/${file.name}` : file.name;
                api.mkdir(TRASH_DIR).then(() => {
                  api.rename(srcPath, `${TRASH_DIR}/${file.name}`);
                });
              }
              file.deleted = true;
              saveFiles();
              playSound('exit');
              const maxIdx = getDisplayFiles().length - 1;
              if (selectedCol > maxIdx) selectedCol = maxIdx;
              updateUI();
            }
          }
          break;
      }
    };

    // ========== Event Listeners ==========
    // Drag & drop global
    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', handleGlobalDrop);

    // Search
    searchInput.addEventListener('focus', () => {
      isSearchFocused = true;
      updateUI();
    });
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      selectedCol = 0;
      updateUI();
    });
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        e.stopPropagation();
        searchInput.value = '';
        searchQuery = '';
        searchInput.blur();
        isSearchFocused = false;
        updateUI();
      } else if (e.key === 'ArrowDown') {
        // 从搜索框按下 → 选中第一个文件
        e.preventDefault();
        e.stopPropagation();
        searchInput.blur();
        isSearchFocused = false;
        selectedRow = 0;
        selectedCol = 0;
        playSound('click');
        updateUI();
      } else if (e.key === 'Backspace' && searchInput.value === '') {
        // Prevent browser back navigation when search is empty
        e.preventDefault();
        e.stopPropagation();
      } else {
        e.stopPropagation();
      }
    });

    // 搜索框失去焦点时清除高亮
    searchInput.addEventListener('blur', () => {
      // 延迟清除，避免点击搜索框时闪烁
      setTimeout(() => {
        if (document.activeElement !== searchInput) {
          isSearchFocused = false;
          updateUI();
        }
      }, 150);
    });

    // File list drag
    fileList.addEventListener('dragover', handleListDragOver);
    fileList.addEventListener('drop', handleListDrop);

    // Breadcrumb back
    breadcrumbBack.addEventListener('click', () => exitFolderMode());

    // Trash zone
    trashZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      isTrashDragOver = true;
      trashZone.classList.add('drag-over');
    });
    trashZone.addEventListener('dragleave', () => {
      isTrashDragOver = false;
      trashZone.classList.remove('drag-over');
    });
    trashZone.addEventListener('drop', handleTrashDrop);

    // Shredder zone
    shredderZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      isShredderDragOver = true;
      shredderZone.classList.add('drag-over');
    });
    shredderZone.addEventListener('dragleave', () => {
      isShredderDragOver = false;
      shredderZone.classList.remove('drag-over');
    });
    shredderZone.addEventListener('drop', handleShredderDrop);

    // Close buttons
    closeBtn.addEventListener('click', returnToParent);
    editorCloseBtn.addEventListener('click', closeEditor);

    // Editor textarea
    editorTextarea.addEventListener('input', (e) => {
      editorContent = e.target.value;
      renderEditorStatus();
      renderLineNumbers();
      // Update find matches if find bar is open
      if (findBarVisible && findInput.value) {
        performFind();
      }
    });
    editorTextarea.addEventListener('keydown', handleEditorKeydown);

    // ========== Ctrl+Scroll Font Zoom ==========
    let editorFontSize = 18; // 当前编辑器字号
    const EDITOR_FONT_SIZE_MIN = 8;
    const EDITOR_FONT_SIZE_MAX = 32;

    const syncLineNumbersLineHeight = () => {
      // 行号行高始终与textarea一致
      const lineHeight = editorFontSize * 1.8;
      document.querySelectorAll('.line-num').forEach(el => {
        el.style.lineHeight = lineHeight + 'px';
        el.style.height = lineHeight + 'px';
      });
    };

    editorTextarea.addEventListener('wheel', (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();

      const delta = e.deltaY > 0 ? -1 : 1;
      const newSize = Math.min(EDITOR_FONT_SIZE_MAX, Math.max(EDITOR_FONT_SIZE_MIN, editorFontSize + delta));
      if (newSize === editorFontSize) return;

      editorFontSize = newSize;
      const lineHeight = editorFontSize * 1.8;
      editorTextarea.style.fontSize = editorFontSize + 'px';
      editorTextarea.style.lineHeight = lineHeight + 'px';

      // 重新渲染行号以匹配新行高
      renderLineNumbers();
    }, { passive: false });

    // 行号跟随textarea滚动同步
    editorTextarea.addEventListener('scroll', () => {
      lineNumbers.scrollTop = editorTextarea.scrollTop;
    });

    // 阻止行号区域被鼠标滚轮单独滚动，将滚轮事件转发给textarea
    lineNumbers.addEventListener('wheel', (e) => {
      e.preventDefault();
      editorTextarea.scrollTop += e.deltaY;
    }, { passive: false });

    // Modal overlay click to close
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });
    createMenuOverlay.addEventListener('click', (e) => {
      if (e.target === createMenuOverlay) closeCreateMenu();
    });

    // Create menu options
    createOptions.querySelectorAll('.create-option').forEach((btn) => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.idx);
        if (idx === 0) createFile('txt');
        else if (idx === 1) createFile('md');
        else if (idx === 2) createFolder();
      });
    });
    createMenuCancel.addEventListener('click', closeCreateMenu);

    // Find bar
    findInput.addEventListener('input', () => performFind());
    findInput.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Enter') {
        e.preventDefault();
        if (e.shiftKey) findPrev();
        else findNext();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        closeFindBar();
      }
    });
    findPrevBtn.addEventListener('click', findPrev);
    findNextBtn.addEventListener('click', findNext);
    findCloseBtn.addEventListener('click', closeFindBar);
    replaceOneBtn.addEventListener('click', replaceOne);
    replaceAllBtn.addEventListener('click', replaceAll);
    replaceInput.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Escape') {
        e.preventDefault();
        closeFindBar();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        replaceOne();
      }
    });

    // Global keyboard
    document.addEventListener('keydown', handleKeydown);

    // ========== Theme ==========
    const applyTheme = (isDark) => {
      document.body.classList.toggle('light-mode', !isDark);
    };

    // ========== Sync Save (beforeunload 用) ==========
    const saveFileSync = (filePath, content) => {
      try {
        const pluginId = window.__PLUGIN_ID__;
        if (pluginId && window.hundun && window.hundun.fs && window.hundun.fs.getBasePath) {
          // 通过主进程同步写入
          const { ipcRenderer } = require('electron');
          ipcRenderer.send('fasttxt:writeFileSync', pluginId, filePath, content);
        }
      } catch (e) {
        console.error('[FastTXT] saveFileSync error:', e);
      }
    };

    // 窗口关闭前同步保存当前编辑文件
    window.addEventListener('beforeunload', () => {
      if (editingFile && editorContent !== undefined) {
        const subPath = editingFile.parentPath
          ? `${editingFile.parentPath}/${editingFile.name}`
          : editingFile.name;
        saveFileSync(subPath, editorContent);
      }
    });

    // ========== Init ==========
    const init = async () => {
      const api = fsAPI();
      if (api) {
        // 确保回收站目录存在
        await api.mkdir(TRASH_DIR);
        // 创建默认文件（如果目录为空）
        await createDefaultFiles();
        // 从磁盘加载文件列表
        await loadFilesFromDisk();
      } else {
        // 无 fs API 时的 fallback（不应发生）
        files = [];
      }
      updateUI();

      if (window.hundun && window.hundun.host) {
        window.hundun.host.getTheme().then(applyTheme);
        window.hundun.host.onThemeChange(applyTheme);
      }
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
