<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastTXT</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    /* ========== CSS Variables - Dark Mode (default) ========== */
    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #141414;
      --bg-card: #1a1a1a;
      --bg-slot: #0d0d0d;
      --text-primary: #e0e0e0;
      --text-secondary: #888888;
      --text-muted: #555555;
      --accent-primary: #00ff88;
      --accent-secondary: #ff0080;
      --accent-tertiary: #00d4ff;
      --border-color: #333333;
      --shadow-color: rgba(0, 255, 136, 0.3);
      --scanline-opacity: 0.03;
    }

    /* Light Mode */
    .light-mode {
      --bg-primary: #FFF8E8;
      --bg-secondary: #FFF3D6;
      --bg-card: #FFFEFB;
      --bg-slot: #FFEEC2;
      --text-primary: #C3272B;
      --text-secondary: #C3272B;
      --text-muted: #C3272B;
      --accent-primary: #C3272B;
      --accent-secondary: #cc0066;
      --accent-tertiary: #0099cc;
      --border-color: #E8DCC8;
      --shadow-color: rgba(0, 0, 0, 0.1);
      --scanline-opacity: 0.01;
    }

    /* ========== Base ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { background: transparent; }

    body {
      font-family: 'Press Start 2P', monospace;
      background: var(--bg-secondary);
      color: var(--text-primary);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    .fasttxt-app {
      width: 100%;
      height: 100%;
      background: var(--bg-secondary);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    /* Views must fill the flex container */
    #view-main, #view-editor {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    /* CRT Scanline */
    .fasttxt-app::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, var(--scanline-opacity, 0.03)) 0px,
        rgba(0, 0, 0, var(--scanline-opacity, 0.03)) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* ========== Deco Screws ========== */
    .deco-screw {
      position: absolute;
      width: 8px;
      height: 8px;
      background: var(--border-color);
      border-radius: 50%;
      z-index: 101;
    }
    .deco-screw::before {
      content: '+';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 6px;
      color: #000;
    }
    .screw-tl { top: 12px; left: 12px; }
    .screw-tr { top: 12px; right: 12px; }
    .screw-bl { bottom: 15px; left: 20px; }
    .screw-br { bottom: 15px; right: 20px; }

    /* ========== Header ========== */
    .ftxt-header {
      height: 48px;
      background: var(--bg-secondary);
      border-bottom: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      -webkit-app-region: drag;
      flex-shrink: 0;
      position: relative;
    }

    .ftxt-logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      font-size: 18px;
    }

    .logo-text {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: var(--accent-primary);
      letter-spacing: 3px;
      text-shadow: 0 0 10px var(--accent-primary);
    }

    .logo-chip {
      font-family: 'Press Start 2P', monospace;
      font-size: 6px;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 2px 4px;
      letter-spacing: 1px;
    }

    .editor-title {
      font-size: 11px;
      max-width: 400px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ftxt-close-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--accent-primary);
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      -webkit-app-region: no-drag;
      z-index: 102;
    }

    .ftxt-close-btn:hover {
      color: var(--accent-secondary, #ff0080);
      box-shadow: 0 0 12px var(--shadow-color);
      transform: scale(1.1);
    }

    /* ========== Content ========== */
    .ftxt-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 16px;
      min-height: 0;
      position: relative;
    }

    /* ========== Search Box ========== */
    .ftxt-search {
      position: absolute;
      top: 12px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 6px 10px;
      z-index: 10;
      transition: all 0.2s ease;
    }

    .ftxt-search:focus-within {
      border-color: var(--accent-primary);
      box-shadow: 0 0 12px var(--shadow-color);
    }

    /* Breadcrumb */
    .ftxt-breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
    }

    .breadcrumb-back {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--accent-primary);
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .breadcrumb-back:hover {
      background: var(--accent-primary);
      color: var(--bg-body);
    }

    .breadcrumb-path {
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .search-icon {
      font-size: 12px;
    }

    .search-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      width: 120px;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    /* ========== File List ========== */
    .ftxt-file-list {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 44px 4px 8px 4px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      align-content: start;
      scrollbar-width: thin;
      scrollbar-color: var(--border-color) transparent;
    }

    .ftxt-file-list::-webkit-scrollbar {
      width: 6px;
    }

    .ftxt-file-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .ftxt-file-list::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    /* Empty State */
    .ftxt-empty {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      opacity: 0.6;
      padding: 40px 0;
    }

    .empty-icon {
      font-size: 48px;
      animation: float 3s ease-in-out infinite;
    }

    .empty-text {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .empty-hint {
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      color: var(--text-muted);
      opacity: 0.6;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* File Card */
    .ftxt-file-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      animation: cardFadeIn 0.3s ease-out both;
      user-select: none;
      min-height: 48px;
      overflow: hidden;
    }

    .ftxt-file-card.selected {
      border-color: var(--accent-primary);
      background: color-mix(in srgb, var(--accent-primary) 10%, var(--bg-card));
      box-shadow: 0 0 16px var(--shadow-color);
    }

    .ftxt-file-card.dragging {
      opacity: 0.4;
      transform: scale(0.95);
    }

    .ftxt-file-card.is-deleted {
      opacity: 0.7;
      border-style: dashed;
    }

    .ftxt-file-card.is-deleted:hover {
      border-color: var(--accent-secondary, #ff0080);
    }

    @keyframes cardFadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .file-icon {
      font-size: 20px;
      flex-shrink: 0;
    }

    .file-info {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-deleted-badge {
      font-family: 'Press Start 2P', monospace;
      font-size: 5px;
      color: var(--accent-secondary, #ff0080);
      border: 1px solid var(--accent-secondary, #ff0080);
      border-radius: 4px;
      padding: 2px 4px;
      flex-shrink: 0;
    }

    /* ========== Trash Zone ========== */
    .ftxt-trash-zone {
      position: absolute;
      bottom: 60px;
      right: 16px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px dashed var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      z-index: 5;
    }

    .ftxt-trash-zone.drag-over {
      border-color: var(--accent-secondary, #ff0080);
      background: color-mix(in srgb, var(--accent-secondary, #ff0080) 15%, transparent);
      transform: scale(1.15);
      box-shadow: 0 0 20px var(--accent-secondary, #ff0080);
    }

    .trash-icon-large {
      font-size: 28px;
    }

    /* ========== Shredder Zone ========== */
    .ftxt-shredder-zone {
      position: absolute;
      bottom: 60px;
      right: 16px;
      width: 80px;
      height: 60px;
      border-radius: 10px;
      border: 2px dashed var(--accent-secondary, #ff0080);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.3s ease;
      z-index: 5;
    }

    .ftxt-shredder-zone.drag-over {
      border-color: #ff0000;
      background: color-mix(in srgb, #ff0000 20%, transparent);
      transform: scale(1.1);
      box-shadow: 0 0 20px #ff0000;
    }

    .shredder-icon {
      font-size: 24px;
    }

    .shredder-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 6px;
      color: var(--accent-secondary, #ff0080);
      letter-spacing: 1px;
    }

    /* ========== Footer ========== */
    .ftxt-footer {
      height: 50px;
      background: var(--bg-secondary);
      border-top: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .footer-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .footer-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--border-color);
      background: var(--bg-card);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .footer-btn.active {
      border-color: var(--accent-primary);
      background: color-mix(in srgb, var(--accent-primary) 20%, var(--bg-card));
      box-shadow: 0 0 12px var(--shadow-color);
    }

    .footer-btn.btn-focused {
      border-color: var(--accent-primary);
      box-shadow: 0 0 16px var(--accent-primary);
      transform: scale(1.15);
    }

    .footer-btn.shredder-btn {
      border-color: var(--accent-secondary, #ff0080);
    }

    .footer-btn.shredder-btn:hover {
      border-color: var(--accent-secondary, #ff0080);
      box-shadow: 0 0 12px var(--accent-secondary, #ff0080);
    }

    .btn-icon {
      font-size: 18px;
      font-weight: bold;
      transition: color 0.2s ease;
    }

    .footer-info {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .file-count, .trash-count {
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* ========== Editor ========== */
    .ftxt-editor {
      flex: 1;
      display: flex;
      min-height: 0;
      background: var(--bg-card);
      margin: 0 16px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }

    .editor-line-numbers {
      width: 40px;
      background: var(--bg-secondary);
      border-right: 2px solid var(--border-color);
      padding: 12px 0;
      overflow-y: hidden;
      flex-shrink: 0;
    }

    .line-num {
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      color: var(--text-muted);
      text-align: right;
      padding: 0 8px;
      line-height: 1.8;
    }

    .editor-textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.8;
      padding: 12px 16px;
      resize: none;
      tab-size: 2;
    }

    .editor-textarea::placeholder {
      color: var(--text-muted);
    }

    .editor-footer {
      justify-content: space-between;
    }

    .editor-status {
      display: flex;
      gap: 16px;
    }

    .status-item {
      font-family: 'Press Start 2P', monospace;
      font-size: 6px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .editor-hint {
      font-family: 'Press Start 2P', monospace;
      font-size: 6px;
      color: var(--accent-primary);
      letter-spacing: 1px;
    }

    /* ========== Modal ========== */
    .ftxt-modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      animation: fadeIn 0.2s ease;
    }

    .ftxt-modal {
      background: var(--bg-secondary);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      max-width: 320px;
      width: 90%;
      text-align: center;
      animation: modalPop 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    .modal-icon {
      font-size: 36px;
      margin-bottom: 12px;
    }

    .modal-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      color: var(--accent-primary);
      margin-bottom: 12px;
      letter-spacing: 2px;
    }

    .modal-message {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      color: var(--text-secondary);
      line-height: 1.8;
      margin-bottom: 20px;
      white-space: pre-line;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .modal-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      padding: 10px 16px;
      border-radius: 8px;
      border: 2px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 1px;
    }

    .modal-btn:hover {
      transform: scale(1.05);
    }

    .modal-btn.primary {
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }

    .modal-btn.primary:hover {
      background: var(--accent-primary);
      color: #000;
    }

    .modal-btn.secondary {
      border-color: var(--text-muted);
      color: var(--text-muted);
    }

    .modal-btn.danger {
      border-color: var(--accent-secondary, #ff0080);
      color: var(--accent-secondary, #ff0080);
    }

    .modal-btn.danger:hover {
      background: var(--accent-secondary, #ff0080);
      color: #fff;
    }

    /* Keyboard selected state */
    .btn-selected {
      border-color: var(--accent-primary) !important;
      box-shadow: 0 0 12px var(--accent-primary);
      transform: scale(1.05);
    }

    .create-option.btn-selected {
      border-color: var(--accent-primary);
      box-shadow: 0 0 12px var(--shadow-color);
      background: color-mix(in srgb, var(--accent-primary) 15%, var(--bg-card));
    }

    /* Create Menu */
    .create-menu {
      min-width: 200px;
    }

    .create-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .create-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .create-option:hover {
      border-color: var(--accent-primary);
      box-shadow: 0 0 12px var(--shadow-color);
    }

    .create-icon {
      font-size: 20px;
    }

    .create-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      color: var(--text-primary);
      letter-spacing: 1px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes modalPop {
      from {
        opacity: 0;
        transform: scale(0.8) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* ========== Light Mode tweaks ========== */
    .light-mode .ftxt-search {
      background: var(--bg-card);
    }

    .light-mode .ftxt-file-card {
      background: var(--bg-card);
    }

    .light-mode .ftxt-file-card.selected {
      background: color-mix(in srgb, var(--accent-primary) 10%, var(--bg-card));
    }

    .light-mode .ftxt-trash-zone {
      border-color: #d8cbb2;
    }

    .light-mode .footer-btn {
      background: var(--bg-card);
    }

    .light-mode .ftxt-modal {
      background: var(--bg-secondary);
    }

    .light-mode .modal-btn {
      background: var(--bg-card);
    }

    .light-mode .editor-line-numbers {
      background: var(--bg-secondary);
    }

    .light-mode .ftxt-editor {
      background: var(--bg-card);
    }

    .light-mode .create-option {
      background: var(--bg-card);
    }

    .light-mode .footer-btn.add-btn {
      background: var(--bg-card);
    }
  </style>
</head>
<body>
  <div class="fasttxt-app" id="app">
    <!-- Decorative Screws -->
    <div class="deco-screw screw-tl"></div>
    <div class="deco-screw screw-tr"></div>
    <div class="deco-screw screw-bl"></div>
    <div class="deco-screw screw-br"></div>

    <!-- ===== Main View ===== -->
    <div id="view-main">
      <!-- Header -->
      <header class="ftxt-header">
        <div class="ftxt-logo">
          <span class="logo-icon">📄</span>
          <span class="logo-text">FastTXT</span>
          <span class="logo-chip">v1.0</span>
        </div>
        <button class="ftxt-close-btn" id="closeBtn" title="Back">✕</button>
      </header>

      <!-- Main Content -->
      <main class="ftxt-content">
        <!-- Search Box -->
        <div class="ftxt-search">
          <span class="search-icon">🔍</span>
          <input class="search-input" id="searchInput" placeholder="Search files..." />
        </div>

        <!-- Folder Breadcrumb -->
        <div class="ftxt-breadcrumb" id="folderBreadcrumb" style="display:none;">
          <button class="breadcrumb-back" id="breadcrumbBack">← Back</button>
          <span class="breadcrumb-path" id="breadcrumbPath"></span>
        </div>

        <!-- File List -->
        <div class="ftxt-file-list" id="fileList"></div>

        <!-- Trash Drop Zone -->
        <div class="ftxt-trash-zone" id="trashZone">
          <span class="trash-icon-large">🗑️</span>
        </div>

        <!-- Shredder Drop Zone -->
        <div class="ftxt-shredder-zone" id="shredderZone" style="display:none;">
          <span class="shredder-icon">⚙️</span>
          <span class="shredder-label">SHREDDER</span>
        </div>
      </main>

      <!-- Footer -->
      <footer class="ftxt-footer">
        <div class="footer-buttons" id="footerButtons"></div>
        <div class="footer-info" id="footerInfo">
          <span class="file-count" id="fileCount"></span>
          <span class="trash-count" id="trashCount" style="display:none;"></span>
        </div>
      </footer>
    </div>

    <!-- ===== Editor View ===== -->
    <div id="view-editor" style="display:none;">
      <header class="ftxt-header editor-header">
        <div class="ftxt-logo">
          <span class="logo-icon" id="editorIcon">📄</span>
          <span class="logo-text editor-title" id="editorTitle">Untitled</span>
        </div>
        <button class="ftxt-close-btn" id="editorCloseBtn" title="Save & Back">✕</button>
      </header>

      <main class="ftxt-editor">
        <div class="editor-line-numbers" id="lineNumbers"></div>
        <textarea class="editor-textarea" id="editorTextarea" spellcheck="false" placeholder="Start typing..."></textarea>
      </main>

      <footer class="ftxt-footer editor-footer">
        <div class="editor-status">
          <span class="status-item" id="statusLines">Lines: 1</span>
          <span class="status-item" id="statusChars">Chars: 0</span>
          <span class="status-item" id="statusType">Plain Text</span>
        </div>
        <div class="editor-hint">
          <span>ESC to save & exit</span>
        </div>
      </footer>
    </div>

    <!-- ===== Modal Overlay ===== -->
    <div class="ftxt-modal-overlay" id="modalOverlay" style="display:none;">
      <div class="ftxt-modal" id="modalBox">
        <div class="modal-icon" id="modalIcon"></div>
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-message" id="modalMessage"></div>
        <div class="modal-buttons" id="modalButtons"></div>
      </div>
    </div>

    <!-- ===== Create Menu Overlay ===== -->
    <div class="ftxt-modal-overlay" id="createMenuOverlay" style="display:none;">
      <div class="ftxt-modal create-menu">
        <div class="modal-icon">+</div>
        <div class="modal-title">CREATE NEW</div>
        <div class="create-options" id="createOptions">
          <button class="create-option" data-idx="0">
            <span class="create-icon">📄</span>
            <span class="create-label">.txt File</span>
          </button>
          <button class="create-option" data-idx="1">
            <span class="create-icon">📝</span>
            <span class="create-label">.md File</span>
          </button>
          <button class="create-option" data-idx="2">
            <span class="create-icon">📁</span>
            <span class="create-label">Folder</span>
          </button>
        </div>
        <div class="modal-buttons">
          <button class="modal-btn secondary" id="createMenuCancel">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ========== PluginSDK: playSound ==========
    const playSound = async (name) => {
      if (window.hundun && window.hundun.host && window.hundun.host.playSound) {
        await window.hundun.host.playSound(name);
      }
    };

    // ========== returnToParent ==========
    const returnToParent = async () => {
      if (window.hundun && window.hundun.host && window.hundun.host.returnToParent) {
        await window.hundun.host.returnToParent();
      } else if (window.hundun && window.hundun.window && window.hundun.window.close) {
        await window.hundun.window.close();
      } else {
        window.close();
      }
    };

    // ========== DOM Refs ==========
    const appEl = document.getElementById('app');
    const viewMain = document.getElementById('view-main');
    const viewEditor = document.getElementById('view-editor');
    const closeBtn = document.getElementById('closeBtn');
    const searchInput = document.getElementById('searchInput');
    const fileList = document.getElementById('fileList');
    const trashZone = document.getElementById('trashZone');
    const shredderZone = document.getElementById('shredderZone');
    const footerButtons = document.getElementById('footerButtons');
    const fileCountEl = document.getElementById('fileCount');
    const trashCountEl = document.getElementById('trashCount');
    const folderBreadcrumb = document.getElementById('folderBreadcrumb');
    const breadcrumbBack = document.getElementById('breadcrumbBack');
    const breadcrumbPath = document.getElementById('breadcrumbPath');
    const editorIcon = document.getElementById('editorIcon');
    const editorTitle = document.getElementById('editorTitle');
    const editorCloseBtn = document.getElementById('editorCloseBtn');
    const lineNumbers = document.getElementById('lineNumbers');
    const editorTextarea = document.getElementById('editorTextarea');
    const statusLines = document.getElementById('statusLines');
    const statusChars = document.getElementById('statusChars');
    const statusType = document.getElementById('statusType');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalIcon = document.getElementById('modalIcon');
    const modalTitle = document.getElementById('modalTitle');
    const modalMessage = document.getElementById('modalMessage');
    const modalButtons = document.getElementById('modalButtons');
    const createMenuOverlay = document.getElementById('createMenuOverlay');
    const createOptions = document.getElementById('createOptions');
    const createMenuCancel = document.getElementById('createMenuCancel');

    // ========== State ==========
    let currentView = 'main';
    let searchQuery = '';
    let isTrashMode = false;
    let isFolderMode = false;
    let currentFolderPath = '';  // e.g. 'NewFolder' or 'NewFolder/SubFolder'
    let isTrashDragOver = false;
    let isShredderDragOver = false;
    let dragFileId = null;

    let selectedRow = 0;
    let selectedCol = 0;

    let files = [];
    let editingFile = null;
    let editorContent = '';

    let modalVisible = false;
    let modalIconText = '';
    let modalTitleText = '';
    let modalMessageText = '';
    let modalButtonDefs = [];
    let modalSelectedBtnIdx = 0;

    let showCreateMenuVisible = false;
    let createMenuSelectedIdx = 0;

    const PROGRAM_FOLDER = 'FastTXT_Data';
    const TRASH_DIR = '.trash';
    const ORDER_FILE = '.order.json';

    // ========== Computed ==========
    const getActiveFiles = () => files.filter(f => !f.deleted).sort((a, b) => a.order - b.order);
    const getDeletedFiles = () => files.filter(f => f.deleted);

    // 获取当前目录下的文件
    const getFilesInCurrentFolder = () => {
      return getActiveFiles().filter(f => {
        const parent = f.parentPath || '';
        return parent === currentFolderPath;
      });
    };

    const getDisplayFiles = () => {
      let base;
      if (isTrashMode) {
        base = getDeletedFiles();
      } else if (isFolderMode) {
        base = getFilesInCurrentFolder();
      } else {
        base = getActiveFiles();
      }
      if (!searchQuery) return base;
      const q = searchQuery.toLowerCase();
      return base.filter(f => f.name.toLowerCase().includes(q));
    };
    const getLineCount = () => editorContent.split('\n').length;

    const getFooterButtons = () => {
      const btns = [
        { id: 'add', icon: '+', action: showCreateMenu, title: 'Create new' },
        { id: 'trash', icon: '🗑️', action: toggleTrashMode, title: isTrashMode ? 'Back to files' : 'Show deleted' },
        { id: 'folder', icon: '📁', action: isFolderMode ? exitFolderMode : enterFolderFromSelection, title: isFolderMode ? `Back to root (${currentFolderPath})` : 'Open folder' },
      ];
      if (isTrashMode) {
        btns.push({ id: 'shredder', icon: '⚙️', action: showShredConfirm, title: 'Shred all' });
      }
      return btns;
    };

    // ========== File System Helpers ==========
    const fsAPI = () => window.hundun && window.hundun.fs ? window.hundun.fs : null;

    const getFileInfoFromName = (name) => {
      const ext = name.substring(name.lastIndexOf('.')).toLowerCase();
      return {
        isText: ext === '.txt' || ext === '.md',
        isMarkdown: ext === '.md'
      };
    };

    // ========== File Management (Disk-based) ==========
    const createDefaultFiles = async () => {
      const api = fsAPI();
      if (!api) return;

      // 检查是否已有文件
      const existing = await api.readDir('');
      if (existing.length > 0) return; // 已有文件，不创建默认

      // 创建默认文件
      await api.writeFile('readme.txt', 'Welcome to FastTXT!\n\nA retro text file manager.\n\nFeatures:\n- Drag & drop import\n- File editing\n- Trash & shred');
      await api.writeFile('notes.md', '# Notes\n\n## TODO\n- [ ] Try dragging files\n- [ ] Create new files\n- [ ] Test the shredder');
      await api.writeFile('draft.txt', 'This is a draft file.\n\nYou can edit this text freely.');
    };

    const loadFilesFromDisk = async () => {
      const api = fsAPI();
      if (!api) { files = []; return; }

      // 读取排序信息
      let orderMap = {};
      try {
        const orderJson = await api.readFile(ORDER_FILE);
        if (orderJson) {
          const parsed = JSON.parse(orderJson);
          if (parsed && Array.isArray(parsed.ids)) {
            parsed.ids.forEach((id, idx) => { orderMap[id] = idx; });
          }
        }
      } catch (_) {}

      // 读取正常目录
      const activeEntries = await api.readDir('');
      // 读取回收站
      const trashEntries = await api.readDir(TRASH_DIR);

      const newFiles = [];
      let maxOrder = 0;

      // 处理正常文件（root + 每个文件夹内部）
      for (const entry of activeEntries) {
        if (entry.name === ORDER_FILE || entry.name === TRASH_DIR) continue;
        if (entry.name.startsWith('.')) continue;

        const id = entry.name;
        const order = orderMap[id] !== undefined ? orderMap[id] : maxOrder++;
        if (order >= maxOrder) maxOrder = order + 1;

        if (entry.isDirectory) {
          newFiles.push({
            id: id,
            name: id,
            content: '',
            deleted: false,
            order: order,
            isFolder: true,
            parentPath: ''  // 文件夹在根目录
          });
          // 读取文件夹内部的文件
          try {
            const subEntries = await api.readDir(id);
            for (const sub of subEntries) {
              if (sub.name.startsWith('.')) continue;
              const subId = `${id}/${sub.name}`;
              const subOrder = orderMap[subId] !== undefined ? orderMap[subId] : maxOrder++;
              if (subOrder >= maxOrder) maxOrder = subOrder + 1;
              newFiles.push({
                id: subId,
                name: sub.name,
                content: null,
                deleted: false,
                order: subOrder,
                isFolder: sub.isDirectory,
                parentPath: id
              });
            }
          } catch (_) {}
        } else {
          // 根目录文件
          newFiles.push({
            id: id,
            name: id,
            content: null,
            deleted: false,
            order: order,
            isFolder: false,
            parentPath: ''
          });
        }
      }

      // 处理回收站文件
      for (const entry of trashEntries) {
        if (entry.name.startsWith('.')) continue;
        const id = entry.name;
        const order = orderMap[id] !== undefined ? orderMap[id] : maxOrder++;
        if (order >= maxOrder) maxOrder = order + 1;

        if (entry.isDirectory) {
          newFiles.push({
            id: id,
            name: id,
            content: '',
            deleted: true,
            order: order,
            isFolder: true
          });
        } else {
          newFiles.push({
            id: id,
            name: id,
            content: null,
            deleted: true,
            order: order,
            isFolder: false
          });
        }
      }

      // 按 orderMap 中不存在的排在最后
      newFiles.sort((a, b) => a.order - b.order);
      files = newFiles;
    };

    const saveOrderToDisk = async () => {
      const api = fsAPI();
      if (!api) return;
      const active = getActiveFiles();
      const deleted = getDeletedFiles();
      const allSorted = [...active, ...deleted];
      const ids = allSorted.map(f => f.id);
      await api.writeFile(ORDER_FILE, JSON.stringify({ ids }, null, 2));
    };

    const saveFiles = async () => {
      await saveOrderToDisk();
    };

    // ========== UI Render ==========
    const updateUI = () => {
      if (currentView === 'main') {
        viewMain.style.display = '';
        viewEditor.style.display = 'none';
        // 面包屑
        if (isFolderMode) {
          folderBreadcrumb.style.display = '';
          breadcrumbPath.textContent = `📁 ${currentFolderPath}`;
        } else {
          folderBreadcrumb.style.display = 'none';
        }
        renderFileList();
        renderFooter();
        updateFooterInfo();
        updateTrashShredderZones();
      } else if (currentView === 'editor') {
        viewMain.style.display = 'none';
        viewEditor.style.display = '';
        renderEditorStatus();
        renderLineNumbers();
      }
      clampSelection();
    };

    const renderFileList = () => {
      const list = getDisplayFiles();

      // 如果文件数量变了，才重建 DOM
      const existingCards = fileList.querySelectorAll('.ftxt-file-card');
      if (existingCards.length !== list.length) {
        rebuildFileListDOM(list);
      } else {
        // 只更新选中状态和内容
        updateFileListSelection(list);
      }
    };

    const rebuildFileListDOM = (list) => {
      fileList.innerHTML = '';

      if (list.length === 0) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'ftxt-empty';
        emptyDiv.innerHTML = `
          <div class="empty-icon">📁</div>
          <div class="empty-text">${isTrashMode ? 'Trash is empty' : isFolderMode ? `No files in ${currentFolderPath}` : 'No files yet'}</div>
          <div class="empty-hint">${isTrashMode || isFolderMode ? '' : 'Drag .txt or .md files here'}</div>
        `;
        fileList.appendChild(emptyDiv);
        return;
      }

      list.forEach((file, idx) => {
        const card = document.createElement('div');
        card.className = 'ftxt-file-card';
        if (selectedRow === 0 && selectedCol === idx) card.classList.add('selected');
        if (dragFileId === file.id) card.classList.add('dragging');
        if (file.deleted) card.classList.add('is-deleted');
        card.draggable = true;
        card.dataset.fileId = file.id;

        let icon = '📄';
        if (file.isFolder) icon = '📁';
        else if (file.name.endsWith('.md')) icon = '📝';
        card.innerHTML = `
          <div class="file-icon">${icon}</div>
          <div class="file-info">
            <div class="file-name">${escapeHtml(file.name)}</div>
          </div>
          ${file.deleted ? '<div class="file-deleted-badge">DELETED</div>' : ''}
        `;

        card.addEventListener('dragstart', (e) => handleFileDragStart(e, file));
        card.addEventListener('dragend', handleFileDragEnd);
        card.addEventListener('click', () => handleFileClick(file));

        fileList.appendChild(card);
      });
    };

    const updateFileListSelection = (list) => {
      const cards = fileList.querySelectorAll('.ftxt-file-card');
      cards.forEach((card, idx) => {
        const file = list[idx];
        if (!file) return;

        // 更新选中状态（只在状态变化时改 class，避免抖动）
        const isSelected = selectedRow === 0 && selectedCol === idx;
        const wasSelected = card.classList.contains('selected');
        if (isSelected !== wasSelected) {
          card.classList.toggle('selected', isSelected);
        }

        const isDragging = dragFileId === file.id;
        const wasDragging = card.classList.contains('dragging');
        if (isDragging !== wasDragging) {
          card.classList.toggle('dragging', isDragging);
        }

        const isDeleted = file.deleted;
        const wasDeleted = card.classList.contains('is-deleted');
        if (isDeleted !== wasDeleted) {
          card.classList.toggle('is-deleted', isDeleted);
        }

        // 更新文件名（以防万一）
        const nameEl = card.querySelector('.file-name');
        if (nameEl && nameEl.textContent !== file.name) {
          nameEl.textContent = file.name;
        }
      });
    };

    const renderFooter = () => {
      const btns = getFooterButtons();

      // 如果按钮数量变了，重建 DOM
      const existingBtns = footerButtons.querySelectorAll('.footer-btn');
      if (existingBtns.length !== btns.length) {
        rebuildFooterDOM(btns);
      } else {
        // 只更新选中状态
        updateFooterSelection(btns);
      }
    };

    const rebuildFooterDOM = (btns) => {
      footerButtons.innerHTML = '';

      btns.forEach((btn, idx) => {
        const el = document.createElement('button');
        el.className = 'footer-btn ' + btn.id + '-btn';
        if (btn.id === 'trash' && isTrashMode) el.classList.add('active');
        if (selectedRow === 1 && selectedCol === idx) el.classList.add('btn-focused');
        el.title = btn.title;
        el.innerHTML = `<span class="btn-icon">${btn.icon}</span>`;
        el.addEventListener('click', () => {
          selectedRow = 1;
          selectedCol = idx;
          btn.action();
          updateUI();
        });
        footerButtons.appendChild(el);
      });
    };

    const updateFooterSelection = (btns) => {
      const elements = footerButtons.querySelectorAll('.footer-btn');
      elements.forEach((el, idx) => {
        const btn = btns[idx];
        if (!btn) return;
        const isFocused = selectedRow === 1 && selectedCol === idx;
        const wasFocused = el.classList.contains('btn-focused');
        if (isFocused !== wasFocused) {
          el.classList.toggle('btn-focused', isFocused);
        }
        const isActive = (btn.id === 'trash' && isTrashMode) || (btn.id === 'folder' && isFolderMode);
        const wasActive = el.classList.contains('active');
        if (isActive !== wasActive) {
          el.classList.toggle('active', isActive);
        }
      });
    };

    const updateFooterInfo = () => {
      const active = getActiveFiles();
      const deleted = getDeletedFiles();
      if (isTrashMode) {
        fileCountEl.textContent = `${deleted.length} deleted`;
        trashCountEl.style.display = 'none';
      } else if (isFolderMode) {
        const inFolder = getFilesInCurrentFolder();
        fileCountEl.textContent = `${inFolder.length} files in ${currentFolderPath}`;
        trashCountEl.style.display = 'none';
      } else {
        fileCountEl.textContent = `${active.length} files`;
        trashCountEl.style.display = 'none';
      }
    };

    const updateTrashShredderZones = () => {
      trashZone.style.display = (isTrashMode || isFolderMode) ? 'none' : '';
      shredderZone.style.display = isTrashMode ? '' : 'none';
    };

    const renderLineNumbers = () => {
      const count = getLineCount();
      lineNumbers.innerHTML = '';
      for (let n = 1; n <= count; n++) {
        const div = document.createElement('div');
        div.className = 'line-num';
        div.textContent = n;
        lineNumbers.appendChild(div);
      }
    };

    const renderEditorStatus = () => {
      statusLines.textContent = `Lines: ${getLineCount()}`;
      statusChars.textContent = `Chars: ${editorContent.length}`;
      statusType.textContent = editingFile && editingFile.name.endsWith('.md') ? 'Markdown' : 'Plain Text';
    };

    const escapeHtml = (str) => str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    // ========== Selection Clamping ==========
    const clampSelection = () => {
      if (currentView === 'main') {
        const list = getDisplayFiles();
        if (list.length === 0) {
          selectedCol = 0;
        } else if (selectedCol >= list.length) {
          selectedCol = list.length - 1;
        }
        if (selectedCol < 0) selectedCol = 0;
        if (selectedRow === 1) {
          const btns = getFooterButtons();
          if (selectedCol >= btns.length) selectedCol = btns.length - 1;
        }
      }
    };

    // ========== File Operations ==========
    const handleFileClick = (file) => {
      playSound('click');
      const list = getDisplayFiles();
      const idx = list.findIndex(f => f.id === file.id);

      // 已经选中了这个文件 → 打开
      if (selectedRow === 0 && selectedCol === idx) {
        openFile(file);
        return;
      }

      // 没选中 → 选中它
      selectedRow = 0;
      selectedCol = idx;
      updateUI();
    };

    const openFile = async (file) => {
      if (file.deleted) {
        restoreFile(file);
        return;
      }

      // 文件夹 → 进入文件夹
      if (file.isFolder) {
        enterFolder(file);
        return;
      }

      const api = fsAPI();
      if (!api) return;

      // 从磁盘读取文件内容
      let content = file.content;
      if (content === null) {
        const subPath = file.parentPath ? `${file.parentPath}/${file.name}` : file.name;
        content = await api.readFile(subPath);
        file.content = content !== null ? content : '';
      }

      playSound('OK');
      editingFile = file;
      editorContent = file.content || '';
      currentView = 'editor';
      updateUI();
      setTimeout(() => editorTextarea.focus(), 0);
    };

    const restoreFile = (file) => {
      playSound('click');
      const api = fsAPI();
      if (api) {
        // 从回收站移动回来
        const trashName = file.name.includes('/') ? file.name.split('/').pop() : file.name;
        api.rename(`${TRASH_DIR}/${trashName}`, file.name);
      }
      file.deleted = false;
      saveFiles();
      updateUI();
    };

    const closeEditor = async () => {
      if (editingFile) {
        const api = fsAPI();
        const newContent = editorContent;
        editingFile.content = newContent;
        // 写入磁盘（使用完整路径）
        if (api) {
          const subPath = editingFile.parentPath ? `${editingFile.parentPath}/${editingFile.name}` : editingFile.name;
          await api.writeFile(subPath, newContent);
        }
        saveFiles();
      }
      playSound('exit');
      currentView = 'main';
      editingFile = null;
      updateUI();
    };

    // ========== External File Import ==========
    const handleGlobalDrop = (e) => {
      e.preventDefault();
      const droppedFiles = e.dataTransfer && e.dataTransfer.files;
      if (!droppedFiles || droppedFiles.length === 0) return;

      for (let i = 0; i < droppedFiles.length; i++) {
        const f = droppedFiles[i];
        const name = f.name.toLowerCase();
        if (name.endsWith('.txt') || name.endsWith('.md')) {
          importFile(f);
        }
      }
    };

    const importFile = (file) => {
      const reader = new FileReader();
      reader.onload = async (e) => {
        const content = e.target.result;
        const api = fsAPI();
        const subPath = isFolderMode ? `${currentFolderPath}/${file.name}` : file.name;
        if (api) {
          // 写入磁盘
          await api.writeFile(subPath, content);
          // 刷新文件列表
          await loadFilesFromDisk();
        } else {
          // fallback: 内存
          const id = isFolderMode ? `${currentFolderPath}/${file.name}` : file.name;
          const newFile = {
            id: id,
            name: file.name,
            content: content,
            deleted: false,
            order: files.length,
            isFolder: false,
            parentPath: currentFolderPath
          };
          files.push(newFile);
        }
        saveFiles();
        playSound('OK');
        updateUI();
      };
      reader.readAsText(file);
    };

    // ========== File Drag & Reorder ==========
    const handleFileDragStart = (e, file) => {
      dragFileId = file.id;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', file.id);
      updateUI();
    };

    const handleFileDragEnd = () => {
      dragFileId = null;
      updateUI();
    };

    const handleListDragOver = (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    };

    const handleListDrop = (e) => {
      e.preventDefault();
      const fileId = e.dataTransfer.getData('text/plain');
      if (!fileId) return;

      const file = files.find(f => f.id === fileId);
      if (!file) return;

      const cards = fileList.querySelectorAll('.ftxt-file-card');
      let newOrder = 0;

      for (let i = 0; i < cards.length; i++) {
        const rect = cards[i].getBoundingClientRect();
        const midY = rect.top + rect.height / 2;
        if (e.clientY > midY) {
          newOrder = i + 1;
        }
      }

      const active = getActiveFiles().filter(f => f.id !== fileId);
      active.splice(newOrder, 0, file);
      active.forEach((f, i) => f.order = i);

      saveFiles();
      playSound('click');
      updateUI();
    };

    // ========== Trash Operations ==========
    const toggleTrashMode = () => {
      playSound('click');
      isTrashMode = !isTrashMode;
      isFolderMode = false;
      currentFolderPath = '';
      selectedRow = 0;
      selectedCol = 0;
      searchQuery = '';
      searchInput.value = '';
      updateUI();
    };

    // ========== Folder Operations ==========
    const enterFolder = (folderFile) => {
      playSound('click');
      isFolderMode = true;
      isTrashMode = false;
      currentFolderPath = folderFile.name;
      selectedRow = 0;
      selectedCol = 0;
      searchQuery = '';
      searchInput.value = '';
      updateUI();
    };

    const enterFolderFromSelection = () => {
      const list = getDisplayFiles();
      const file = list[selectedCol];
      if (file && file.isFolder) {
        enterFolder(file);
      }
    };

    const exitFolderMode = () => {
      playSound('click');
      isFolderMode = false;
      currentFolderPath = '';
      selectedRow = 0;
      selectedCol = 0;
      searchQuery = '';
      searchInput.value = '';
      updateUI();
    };

    const handleTrashDrop = async (e) => {
      e.preventDefault();
      isTrashDragOver = false;
      trashZone.classList.remove('drag-over');
      const fileId = e.dataTransfer.getData('text/plain');
      if (!fileId) return;

      const file = files.find(f => f.id === fileId);
      if (file && !file.deleted) {
        const api = fsAPI();
        if (api) {
          // 确保 .trash 目录存在
          await api.mkdir(TRASH_DIR);
          // 移动文件到回收站
          const srcPath = file.parentPath ? `${file.parentPath}/${file.name}` : file.name;
          const trashPath = `${TRASH_DIR}/${file.name}`;
          await api.rename(srcPath, trashPath);
        }
        file.deleted = true;
        saveFiles();
        playSound('exit');
        updateUI();
      }
    };

    const handleShredderDrop = async (e) => {
      e.preventDefault();
      isShredderDragOver = false;
      shredderZone.classList.remove('drag-over');
      const fileId = e.dataTransfer.getData('text/plain');
      if (!fileId) return;

      const file = files.find(f => f.id === fileId);
      if (file && file.deleted) {
        const api = fsAPI();
        if (api) {
          // 从磁盘永久删除
          await api.deleteFile(`${TRASH_DIR}/${file.name}`);
        }
        const idx = files.findIndex(f => f.id === fileId);
        if (idx !== -1) {
          files.splice(idx, 1);
          saveFiles();
          playSound('error');
          updateUI();
        }
      }
    };

    // ========== Shredder Operation ==========
    const showShredConfirm = () => {
      if (getDeletedFiles().length === 0) {
        showModal('📭', 'EMPTY TRASH', 'No files to shred', [
          { text: 'OK', class: 'primary', action: closeModal }
        ]);
        return;
      }

      showModal('⚙️', 'SHRED ALL?', `Permanently delete ${getDeletedFiles().length} file(s)?`, [
        { text: 'Cancel', class: 'secondary', action: closeModal },
        { text: '⚙️ Shred All', class: 'danger', action: shredAll }
      ]);
    };

    const shredAll = async () => {
      const api = fsAPI();
      if (api) {
        // 从磁盘永久删除回收站中所有文件
        const deleted = getDeletedFiles();
        for (const file of deleted) {
          await api.deleteFile(`${TRASH_DIR}/${file.name}`);
        }
      }
      files = files.filter(f => !f.deleted);
      saveFiles();
      closeModal();
      playSound('error');
      updateUI();
    };

    const openFolder = async () => {
      playSound('click');
      try {
        // 优先用 preload 提供的 API（通过主进程 shell.openPath）
        if (window.hundun && window.hundun.fs && window.hundun.fs.openInExplorer) {
          await window.hundun.fs.openInExplorer();
          return;
        }
      } catch (e) {
        console.warn('[FastTXT] preload openInExplorer failed, trying fallback:', e);
      }
      // fallback: 直接用 Electron shell（需要 nodeIntegration: true）
      try {
        const { shell } = require('electron');
        const filePath = decodeURIComponent(window.location.pathname);
        const dirPath = filePath.replace(/^\/?([A-Z]:)/, '$1').replace(/\/index\.html$/, '');
        shell.openPath(dirPath);
      } catch (e) {
        console.error('[FastTXT] openFolder fallback error:', e);
      }
    };

    // ========== Create File / Folder ==========
    const showCreateMenu = () => {
      playSound('click');
      createMenuSelectedIdx = 0;
      showCreateMenuVisible = true;
      renderCreateMenu();
    };

    const closeCreateMenu = () => {
      showCreateMenuVisible = false;
      createMenuOverlay.style.display = 'none';
    };

    const renderCreateMenu = () => {
      if (!showCreateMenuVisible) return;
      createMenuOverlay.style.display = '';
      const options = createOptions.querySelectorAll('.create-option');
      options.forEach((opt, idx) => {
        opt.classList.toggle('btn-selected', idx === createMenuSelectedIdx);
      });
    };

    const createFile = async (type) => {
      closeCreateMenu();
      const ext = type === 'txt' ? '.txt' : '.md';
      const name = `new_file${ext}`;
      const api = fsAPI();
      const subPath = isFolderMode ? `${currentFolderPath}/${name}` : name;
      if (api) {
        await api.writeFile(subPath, '');
        await loadFilesFromDisk();
      } else {
        const id = isFolderMode ? `${currentFolderPath}/${name}` : name;
        const newFile = {
          id: id,
          name: name,
          content: '',
          deleted: false,
          order: files.length,
          isFolder: false,
          parentPath: currentFolderPath
        };
        files.push(newFile);
      }
      saveFiles();
      playSound('OK');
      // 找到刚创建的文件并打开编辑
      const newFile = files.find(f => f.name === name);
      if (newFile) {
        editingFile = newFile;
        editorContent = '';
        currentView = 'editor';
        updateUI();
        setTimeout(() => editorTextarea.focus(), 0);
      } else {
        updateUI();
      }
    };

    const createFolder = async () => {
      closeCreateMenu();
      const api = fsAPI();
      const folderName = 'NewFolder';
      const subPath = isFolderMode ? `${currentFolderPath}/${folderName}` : folderName;
      if (api) {
        await api.mkdir(subPath);
        await loadFilesFromDisk();
      } else {
        const id = isFolderMode ? `${currentFolderPath}/${folderName}` : folderName;
        const newFolder = {
          id: id,
          name: folderName,
          content: '',
          isFolder: true,
          deleted: false,
          order: files.length,
          parentPath: currentFolderPath
        };
        files.push(newFolder);
      }
      saveFiles();
      playSound('OK');
      updateUI();
    };

    // ========== Modal ==========
    const showModal = (icon, title, message, buttons) => {
      modalIconText = icon;
      modalTitleText = title;
      modalMessageText = message;
      modalButtonDefs = buttons;
      modalSelectedBtnIdx = 0;
      modalVisible = true;
      renderModal();
    };

    const closeModal = () => {
      modalVisible = false;
      modalOverlay.style.display = 'none';
    };

    const renderModal = () => {
      if (!modalVisible) return;
      modalOverlay.style.display = '';
      modalIcon.textContent = modalIconText;
      modalTitle.textContent = modalTitleText;
      modalMessage.textContent = modalMessageText;

      modalButtons.innerHTML = '';
      modalButtonDefs.forEach((btn, idx) => {
        const el = document.createElement('button');
        el.className = 'modal-btn';
        if (btn.class) el.className += ' ' + btn.class;
        if (idx === modalSelectedBtnIdx) el.className += ' btn-selected';
        el.textContent = btn.text;
        el.addEventListener('click', btn.action);
        modalButtons.appendChild(el);
      });
    };

    // ========== Editor Keydown ==========
    const handleEditorKeydown = (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = editorTextarea.selectionStart;
        const end = editorTextarea.selectionEnd;
        editorContent = editorContent.substring(0, start) + '  ' + editorContent.substring(end);
        editorTextarea.value = editorContent;
        editorTextarea.selectionStart = editorTextarea.selectionEnd = start + 2;
        renderEditorStatus();
        renderLineNumbers();
      }
    };

    // ========== Global Keyboard ==========
    const handleKeydown = (e) => {
      let key = e.key;
      if (key === 'w' || key === 'W') key = 'ArrowUp';
      if (key === 's' || key === 'S') key = 'ArrowDown';
      if (key === 'a' || key === 'A') key = 'ArrowLeft';
      if (key === 'd' || key === 'D') key = 'ArrowRight';

      // Modal open
      if (modalVisible) {
        e.preventDefault();
        e.stopImmediatePropagation();
        if (key === 'Escape') {
          closeModal();
          playSound('click');
        } else if (key === 'ArrowUp' || key === 'ArrowDown' || key === 'ArrowLeft' || key === 'ArrowRight') {
          playSound('click');
          if (key === 'ArrowUp') {
            modalSelectedBtnIdx = modalButtonDefs.length - 1;
          } else if (key === 'ArrowDown') {
            modalSelectedBtnIdx = 0;
          } else if (key === 'ArrowLeft') {
            modalSelectedBtnIdx = Math.max(0, modalSelectedBtnIdx - 1);
          } else if (key === 'ArrowRight') {
            modalSelectedBtnIdx = Math.min(modalButtonDefs.length - 1, modalSelectedBtnIdx + 1);
          }
          renderModal();
        } else if (key === 'Enter' || key === ' ') {
          playSound('click');
          const btn = modalButtonDefs[modalSelectedBtnIdx];
          if (btn && btn.action) btn.action();
        }
        return;
      }

      // Create menu open
      if (showCreateMenuVisible) {
        e.preventDefault();
        e.stopImmediatePropagation();
        const totalOpts = 3;
        if (key === 'Escape') {
          closeCreateMenu();
          playSound('click');
        } else if (key === 'ArrowUp' || key === 'ArrowDown') {
          playSound('click');
          if (key === 'ArrowUp') {
            createMenuSelectedIdx = (createMenuSelectedIdx + totalOpts - 1) % totalOpts;
          } else {
            createMenuSelectedIdx = (createMenuSelectedIdx + 1) % totalOpts;
          }
          renderCreateMenu();
        } else if (key === 'Enter' || key === ' ') {
          playSound('click');
          if (createMenuSelectedIdx === 0) createFile('txt');
          else if (createMenuSelectedIdx === 1) createFile('md');
          else if (createMenuSelectedIdx === 2) createFolder();
          else closeCreateMenu();
        }
        return;
      }

      // Editor mode
      if (currentView === 'editor') {
        if (e.key === 'Escape') {
          e.preventDefault();
          e.stopImmediatePropagation();
          closeEditor();
        }
        return;
      }

      // Main view
      if (e.key === 'Escape') {
        if (isTrashMode) {
          e.stopImmediatePropagation();
          isTrashMode = false;
          playSound('exit');
          updateUI();
        } else {
          returnToParent();
        }
        return;
      }

      if (key === ' ') key = 'Enter';

      switch (key) {
        case 'ArrowUp':
          e.preventDefault();
          if (selectedRow === 1) {
            selectedRow = 0;
            clampSelection();
          }
          playSound('click');
          updateUI();
          break;

        case 'ArrowDown':
          e.preventDefault();
          if (selectedRow === 0) {
            selectedRow = 1;
            const btns = getFooterButtons();
            selectedCol = Math.min(selectedCol, btns.length - 1);
          }
          playSound('click');
          updateUI();
          break;

        case 'ArrowLeft':
          e.preventDefault();
          if (selectedCol > 0) {
            selectedCol--;
          }
          playSound('click');
          updateUI();
          break;

        case 'ArrowRight':
          e.preventDefault();
          if (selectedRow === 0) {
            const maxFileCol = getDisplayFiles().length - 1;
            if (selectedCol < maxFileCol) selectedCol++;
          } else {
            const maxBtnCol = getFooterButtons().length - 1;
            if (selectedCol < maxBtnCol) selectedCol++;
          }
          playSound('click');
          updateUI();
          break;

        case 'Enter':
          e.preventDefault();
          if (selectedRow === 0) {
            const file = getDisplayFiles()[selectedCol];
            if (file) openFile(file);
          } else {
            const btn = getFooterButtons()[selectedCol];
            if (btn) btn.action();
          }
          break;

        case 'Delete':
        case 'Backspace':
          e.preventDefault();
          if (selectedRow === 0 && !isTrashMode) {
            const file = getDisplayFiles()[selectedCol];
            if (file && !file.deleted) {
              const api = fsAPI();
              if (api) {
                const srcPath = file.parentPath ? `${file.parentPath}/${file.name}` : file.name;
                api.mkdir(TRASH_DIR).then(() => {
                  api.rename(srcPath, `${TRASH_DIR}/${file.name}`);
                });
              }
              file.deleted = true;
              saveFiles();
              playSound('exit');
              const maxIdx = getDisplayFiles().length - 1;
              if (selectedCol > maxIdx) selectedCol = maxIdx;
              updateUI();
            }
          }
          break;
      }
    };

    // ========== Event Listeners ==========
    // Drag & drop global
    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', handleGlobalDrop);

    // Search
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      selectedCol = 0;
      updateUI();
    });
    searchInput.addEventListener('keydown', (e) => e.stopPropagation());

    // File list drag
    fileList.addEventListener('dragover', handleListDragOver);
    fileList.addEventListener('drop', handleListDrop);

    // Breadcrumb back
    breadcrumbBack.addEventListener('click', () => exitFolderMode());

    // Trash zone
    trashZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      isTrashDragOver = true;
      trashZone.classList.add('drag-over');
    });
    trashZone.addEventListener('dragleave', () => {
      isTrashDragOver = false;
      trashZone.classList.remove('drag-over');
    });
    trashZone.addEventListener('drop', handleTrashDrop);

    // Shredder zone
    shredderZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      isShredderDragOver = true;
      shredderZone.classList.add('drag-over');
    });
    shredderZone.addEventListener('dragleave', () => {
      isShredderDragOver = false;
      shredderZone.classList.remove('drag-over');
    });
    shredderZone.addEventListener('drop', handleShredderDrop);

    // Close buttons
    closeBtn.addEventListener('click', returnToParent);
    editorCloseBtn.addEventListener('click', closeEditor);

    // Editor textarea
    editorTextarea.addEventListener('input', (e) => {
      editorContent = e.target.value;
      renderEditorStatus();
      renderLineNumbers();
    });
    editorTextarea.addEventListener('keydown', handleEditorKeydown);

    // Modal overlay click to close
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });
    createMenuOverlay.addEventListener('click', (e) => {
      if (e.target === createMenuOverlay) closeCreateMenu();
    });

    // Create menu options
    createOptions.querySelectorAll('.create-option').forEach((btn) => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.idx);
        if (idx === 0) createFile('txt');
        else if (idx === 1) createFile('md');
        else if (idx === 2) createFolder();
      });
    });
    createMenuCancel.addEventListener('click', closeCreateMenu);

    // Global keyboard
    document.addEventListener('keydown', handleKeydown);

    // ========== Theme ==========
    const applyTheme = (isDark) => {
      document.body.classList.toggle('light-mode', !isDark);
    };

    // ========== Init ==========
    const init = async () => {
      const api = fsAPI();
      if (api) {
        // 确保回收站目录存在
        await api.mkdir(TRASH_DIR);
        // 创建默认文件（如果目录为空）
        await createDefaultFiles();
        // 从磁盘加载文件列表
        await loadFilesFromDisk();
      } else {
        // 无 fs API 时的 fallback（不应发生）
        files = [];
      }
      updateUI();

      if (window.hundun && window.hundun.host) {
        window.hundun.host.getTheme().then(applyTheme);
        window.hundun.host.onThemeChange(applyTheme);
      }
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
