<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastTXT</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    /* ========== CSS Variables - Dark Mode (default) ========== */
    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #141414;
      --bg-card: #1a1a1a;
      --bg-slot: #0d0d0d;
      --text-primary: #e0e0e0;
      --text-secondary: #888888;
      --text-muted: #555555;
      --accent-primary: #00ff88;
      --accent-secondary: #ff0080;
      --accent-tertiary: #00d4ff;
      --border-color: #333333;
      --shadow-color: rgba(0, 255, 136, 0.3);
      --scanline-opacity: 0.03;
    }

    /* Light Mode */
    .light-mode {
      --bg-primary: #FFF8E8;
      --bg-secondary: #FFF3D6;
      --bg-card: #FFFEFB;
      --bg-slot: #FFEEC2;
      --text-primary: #C3272B;
      --text-secondary: #C3272B;
      --text-muted: #C3272B;
      --accent-primary: #C3272B;
      --accent-secondary: #cc0066;
      --accent-tertiary: #0099cc;
      --border-color: #E8DCC8;
      --shadow-color: rgba(0, 0, 0, 0.1);
      --scanline-opacity: 0.01;
    }

    /* ========== Base ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { background: transparent; }

    body {
      font-family: 'Press Start 2P', monospace;
      background: var(--bg-secondary);
      color: var(--text-primary);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    .fasttxt-app {
      width: 100%;
      height: 100%;
      background: var(--bg-secondary);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    /* Views must fill the flex container */
    #view-main, #view-editor {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    /* CRT Scanline */
    .fasttxt-app::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, var(--scanline-opacity, 0.03)) 0px,
        rgba(0, 0, 0, var(--scanline-opacity, 0.03)) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* ========== Deco Screws ========== */
    .deco-screw {
      position: absolute;
      width: 8px;
      height: 8px;
      background: var(--border-color);
      border-radius: 50%;
      z-index: 101;
    }
    .deco-screw::before {
      content: '+';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 6px;
      color: #000;
    }
    .screw-tl { top: 12px; left: 12px; }
    .screw-tr { top: 12px; right: 12px; }
    .screw-bl { bottom: 15px; left: 20px; }
    .screw-br { bottom: 15px; right: 20px; }

    /* ========== Header ========== */
    .ftxt-header {
      height: 48px;
      background: var(--bg-secondary);
      border-bottom: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      -webkit-app-region: drag;
      flex-shrink: 0;
      position: relative;
    }

    .ftxt-logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      font-size: 18px;
    }

    .logo-text {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: var(--accent-primary);
      letter-spacing: 3px;
      text-shadow: 0 0 10px var(--accent-primary);
    }

    .logo-chip {
      font-family: 'Press Start 2P', monospace;
      font-size: 6px;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 2px 4px;
      letter-spacing: 1px;
    }

    .editor-title {
      font-size: 11px;
      max-width: 400px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ftxt-close-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--accent-primary);
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      -webkit-app-region: no-drag;
      z-index: 102;
    }

    .ftxt-close-btn:hover {
      color: var(--accent-secondary, #ff0080);
      box-shadow: 0 0 12px var(--shadow-color);
      transform: scale(1.1);
    }

    /* ========== Content ========== */
    .ftxt-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 16px;
      min-height: 0;
      position: relative;
    }

    /* ========== Search Box ========== */
    .ftxt-search {
      position: absolute;
      top: 12px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 6px 10px;
      z-index: 10;
      transition: all 0.2s ease;
    }

    .ftxt-search:focus-within {
      border-color: var(--accent-primary);
      box-shadow: 0 0 12px var(--shadow-color);
    }

    .ftxt-search.search-focused {
      border-color: var(--accent-primary);
      box-shadow: 0 0 12px var(--shadow-color);
    }

    /* Breadcrumb */
    .ftxt-breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
    }

    .breadcrumb-back {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--accent-primary);
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .breadcrumb-back:hover {
      background: var(--accent-primary);
      color: var(--bg-body);
    }

    .breadcrumb-path {
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .search-icon {
      font-size: 12px;
    }

    .search-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      width: 120px;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    /* ========== File List ========== */
    .ftxt-file-list {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 44px 4px 8px 4px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      align-content: start;
      scrollbar-width: thin;
      scrollbar-color: var(--border-color) transparent;
    }

    .ftxt-file-list::-webkit-scrollbar {
      width: 6px;
    }

    .ftxt-file-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .ftxt-file-list::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    /* Empty State */
    .ftxt-empty {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      opacity: 0.6;
      padding: 40px 0;
    }

    .empty-icon {
      font-size: 48px;
      animation: float 3s ease-in-out infinite;
    }

    .empty-text {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .empty-hint {
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      color: var(--text-muted);
      opacity: 0.6;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* File Card */
    .ftxt-file-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      animation: cardFadeIn 0.3s ease-out both;
      user-select: none;
      min-height: 48px;
      overflow: hidden;
      position: relative;
    }

    .ftxt-file-card.selected {
      border-color: var(--accent-primary);
      background: color-mix(in srgb, var(--accent-primary) 10%, var(--bg-card));
      box-shadow: 0 0 16px var(--shadow-color);
    }

    .ftxt-file-card.dragging {
      opacity: 0.4;
      transform: scale(0.95);
    }

    .ftxt-file-card.is-deleted {
      opacity: 0.7;
      border-style: dashed;
    }

    .ftxt-file-card.is-deleted:hover {
      border-color: var(--accent-secondary, #ff0080);
    }

    @keyframes cardFadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .file-icon {
      font-size: 20px;
      flex-shrink: 0;
    }

    .file-info {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ========== Rename Input ========== */
    .file-rename-input {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--text-primary);
      background: var(--bg-primary);
      border: 2px solid var(--accent-primary);
      border-radius: 4px;
      padding: 3px 6px;
      width: 100%;
      outline: none;
      box-shadow: 0 0 8px var(--shadow-color);
      user-select: text;
    }

    .file-rename-input::selection {
      background: var(--accent-primary);
      color: #000;
    }

    .light-mode .file-rename-input {
      background: var(--bg-card);
    }

    /* ========== Rename Button (on card) ========== */
    .file-rename-btn {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: var(--bg-secondary);
      color: var(--text-muted);
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: all 0.15s ease;
      z-index: 2;
      flex-shrink: 0;
      line-height: 1;
    }

    .ftxt-file-card.selected .file-rename-btn {
      opacity: 1;
    }

    .file-rename-btn:hover {
      border-color: var(--accent-primary);
      color: var(--accent-primary);
      box-shadow: 0 0 8px var(--shadow-color);
    }

    .ftxt-file-card.is-deleted .file-rename-btn {
      display: none;
    }

    .file-deleted-badge {
      font-family: 'Press Start 2P', monospace;
      font-size: 5px;
      color: var(--accent-secondary, #ff0080);
      border: 1px solid var(--accent-secondary, #ff0080);
      border-radius: 4px;
      padding: 2px 4px;
      flex-shrink: 0;
    }

    /* ========== Trash Zone ========== */
    .ftxt-trash-zone {
      position: absolute;
      bottom: 60px;
      right: 16px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px dashed var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      z-index: 5;
    }

    .ftxt-trash-zone.drag-over {
      border-color: var(--accent-secondary, #ff0080);
      background: color-mix(in srgb, var(--accent-secondary, #ff0080) 15%, transparent);
      transform: scale(1.15);
      box-shadow: 0 0 20px var(--accent-secondary, #ff0080);
    }

    .trash-icon-large {
      font-size: 28px;
    }

    /* ========== Shredder Zone ========== */
    .ftxt-shredder-zone {
      position: absolute;
      bottom: 60px;
      right: 16px;
      width: 80px;
      height: 60px;
      border-radius: 10px;
      border: 2px dashed var(--accent-secondary, #ff0080);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.3s ease;
      z-index: 5;
    }

    .ftxt-shredder-zone.drag-over {
      border-color: #ff0000;
      background: color-mix(in srgb, #ff0000 20%, transparent);
      transform: scale(1.1);
      box-shadow: 0 0 20px #ff0000;
    }

    .shredder-icon {
      font-size: 24px;
    }

    .shredder-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 6px;
      color: var(--accent-secondary, #ff0080);
      letter-spacing: 1px;
    }

    /* ========== Footer ========== */
    .ftxt-footer {
      height: 50px;
      background: var(--bg-secondary);
      border-top: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .footer-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .footer-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--border-color);
      background: var(--bg-card);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .footer-btn.active {
      border-color: var(--accent-primary);
      background: color-mix(in srgb, var(--accent-primary) 20%, var(--bg-card));
      box-shadow: 0 0 12px var(--shadow-color);
    }

    .footer-btn.btn-focused {
      border-color: var(--accent-primary);
      box-shadow: 0 0 16px var(--accent-primary);
      transform: scale(1.15);
    }

    .footer-btn.shredder-btn {
      border-color: var(--accent-secondary, #ff0080);
    }

    .footer-btn.shredder-btn:hover {
      border-color: var(--accent-secondary, #ff0080);
      box-shadow: 0 0 12px var(--accent-secondary, #ff0080);
    }

    .btn-icon {
      font-size: 18px;
      font-weight: bold;
      transition: color 0.2s ease;
    }

    .footer-info {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .file-count, .trash-count {
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* ========== Editor ========== */
    .ftxt-editor {
      flex: 1;
      display: flex;
      min-height: 0;
      background: var(--bg-card);
      margin: 0 16px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }

    .editor-line-numbers {
      width: 40px;
      background: var(--bg-secondary);
      border-right: 2px solid var(--border-color);
      padding: 12px 0;
      overflow-y: auto;
      overflow-x: hidden;
      flex-shrink: 0;
      scrollbar-width: none;
    }

    .editor-line-numbers::-webkit-scrollbar {
      display: none;
    }

    .line-num {
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      color: var(--text-muted);
      text-align: right;
      padding: 0 8px;
      line-height: 32.4px;
      height: 32.4px;
    }

    .editor-textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: 'Courier New', monospace;
      font-size: 18px;
      line-height: 32.4px;
      padding: 12px 16px;
      resize: none;
      tab-size: 2;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .editor-textarea::placeholder {
      color: var(--text-muted);
    }

    .editor-textarea::-webkit-scrollbar {
      width: 6px;
    }

    .editor-textarea::-webkit-scrollbar-track {
      background: transparent;
    }

    .editor-textarea::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    .editor-textarea::-webkit-scrollbar-thumb:hover {
      background: var(--accent-primary);
    }

    .editor-footer {
      justify-content: space-between;
    }

    .editor-status {
      display: flex;
      gap: 16px;
    }

    .status-item {
      font-family: 'Press Start 2P', monospace;
      font-size: 6px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .editor-hint {
      font-family: 'Press Start 2P', monospace;
      font-size: 6px;
      color: var(--accent-primary);
      letter-spacing: 1px;
    }

    /* ========== Modal ========== */
    .ftxt-modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      animation: fadeIn 0.2s ease;
    }

    .ftxt-modal {
      background: var(--bg-secondary);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      max-width: 320px;
      width: 90%;
      text-align: center;
      animation: modalPop 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    .modal-icon {
      font-size: 36px;
      margin-bottom: 12px;
    }

    .modal-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      color: var(--accent-primary);
      margin-bottom: 12px;
      letter-spacing: 2px;
    }

    .modal-message {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      color: var(--text-secondary);
      line-height: 1.8;
      margin-bottom: 20px;
      white-space: pre-line;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .modal-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      padding: 10px 16px;
      border-radius: 8px;
      border: 2px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 1px;
    }

    .modal-btn:hover {
      transform: scale(1.05);
    }

    .modal-btn.primary {
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }

    .modal-btn.primary:hover {
      background: var(--accent-primary);
      color: #000;
    }

    .modal-btn.secondary {
      border-color: var(--text-muted);
      color: var(--text-muted);
    }

    .modal-btn.danger {
      border-color: var(--accent-secondary, #ff0080);
      color: var(--accent-secondary, #ff0080);
    }

    .modal-btn.danger:hover {
      background: var(--accent-secondary, #ff0080);
      color: #fff;
    }

    /* Keyboard selected state */
    .btn-selected {
      border-color: var(--accent-primary) !important;
      box-shadow: 0 0 12px var(--accent-primary);
      transform: scale(1.05);
    }

    .create-option.btn-selected {
      border-color: var(--accent-primary);
      box-shadow: 0 0 12px var(--shadow-color);
      background: color-mix(in srgb, var(--accent-primary) 15%, var(--bg-card));
    }

    /* Create Menu */
    .create-menu {
      min-width: 200px;
    }

    .create-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .create-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .create-option:hover {
      border-color: var(--accent-primary);
      box-shadow: 0 0 12px var(--shadow-color);
    }

    .create-icon {
      font-size: 20px;
    }

    .create-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      color: var(--text-primary);
      letter-spacing: 1px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes modalPop {
      from {
        opacity: 0;
        transform: scale(0.8) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* ========== Light Mode tweaks ========== */
    .light-mode .ftxt-search {
      background: var(--bg-card);
    }

    .light-mode .ftxt-file-card {
      background: var(--bg-card);
    }

    .light-mode .ftxt-file-card.selected {
      background: color-mix(in srgb, var(--accent-primary) 10%, var(--bg-card));
    }

    .light-mode .ftxt-trash-zone {
      border-color: #d8cbb2;
    }

    .light-mode .footer-btn {
      background: var(--bg-card);
    }

    .light-mode .ftxt-modal {
      background: var(--bg-secondary);
    }

    .light-mode .modal-btn {
      background: var(--bg-card);
    }

    .light-mode .editor-line-numbers {
      background: var(--bg-secondary);
    }

    .light-mode .ftxt-editor {
      background: var(--bg-card);
    }

    .light-mode .ftxt-find-bar {
      background: var(--bg-secondary);
    }

    .light-mode .find-input {
      background: var(--bg-card);
    }

    .light-mode .find-btn {
      background: var(--bg-card);
    }

    .light-mode .create-option {
      background: var(--bg-card);
    }

    .light-mode .footer-btn.add-btn {
      background: var(--bg-card);
    }

    /* ========== Find & Replace Bar ========== */
    .ftxt-find-bar {
      background: var(--bg-secondary);
      border-bottom: 2px solid var(--border-color);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
      animation: slideDown 0.15s ease;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-100%); }
      to { opacity: 1; transform: translateY(0); }
    }

    .find-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .find-icon {
      font-size: 12px;
      flex-shrink: 0;
    }

    .find-input {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 4px 8px;
      color: var(--text-primary);
      font-family: 'Courier New', monospace;
      font-size: 11px;
      outline: none;
      min-width: 0;
    }

    .find-input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 6px var(--shadow-color);
    }

    .find-count {
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      color: var(--text-muted);
      min-width: 40px;
      text-align: center;
      flex-shrink: 0;
    }

    .find-btn {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .find-btn:hover {
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }

    .find-close-btn:hover {
      border-color: var(--accent-secondary, #ff0080);
      color: var(--accent-secondary, #ff0080);
    }

    .replace-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      width: auto;
      padding: 0 8px;
    }

    .find-match {
      background: color-mix(in srgb, var(--accent-tertiary, #00d4ff) 30%, transparent);
      outline: 1px solid var(--accent-tertiary, #00d4ff);
    }

    .find-match-active {
      background: color-mix(in srgb, var(--accent-primary) 40%, transparent);
      outline: 2px solid var(--accent-primary);
      box-shadow: 0 0 8px var(--shadow-color);
    }

    /* ========== Auto-save Indicator ========== */
    .auto-save-indicator {
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      color: var(--accent-primary);
      letter-spacing: 1px;
      animation: fadeInOut 1.5s ease;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { opacity: 0; }
    }

    .shortcut-hint {
      font-family: 'Press Start 2P', monospace;
      font-size: 5px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="fasttxt-app" id="app">
    <!-- Decorative Screws -->
    <div class="deco-screw screw-tl"></div>
    <div class="deco-screw screw-tr"></div>
    <div class="deco-screw screw-bl"></div>
    <div class="deco-screw screw-br"></div>

    <!-- ===== Main View ===== -->
    <div id="view-main">
      <!-- Header -->
      <header class="ftxt-header">
        <div class="ftxt-logo">
          <span class="logo-icon">📄</span>
          <span class="logo-text">FastTXT</span>
          <span class="logo-chip">v1.0</span>
        </div>
        <button class="ftxt-close-btn" id="closeBtn" title="Back">✕</button>
      </header>

      <!-- Main Content -->
      <main class="ftxt-content">
        <!-- Search Box -->
        <div class="ftxt-search">

        </div>

        <!-- Folder Breadcrumb -->
        <div class="ftxt-breadcrumb" id="folderBreadcrumb" style="display:none;">

        <!-- File List -->

        <!-- Shredder Drop Zone -->
        <div class="ftxt-shredder-zone" id="shredderZone" style="display:none;">

      </main>

      <!-- Footer -->
      <footer class="ftxt-footer">

        <div class="footer-info" id="footerInfo">

    <!-- ===== Editor View ===== -->
    <div id="view-editor" style="display:none;">
      <header class="ftxt-header editor-header">
        <div class="ftxt-logo">

        <button class="ftxt-close-btn" id="editorCloseBtn" title="Save & Back">✕</button>
      </header>

      <main class="ftxt-editor">
        <!-- Find & Replace Bar -->
        <div class="ftxt-find-bar" id="findBar" style="display:none;">
          <div class="find-row">
            <span class="find-icon">🔍</span>
            <input class="find-input" id="findInput" placeholder="Find..." spellcheck="false" />
            <span class="find-count" id="findCount">0/0</span>
            <button class="find-btn" id="findPrevBtn" title="Previous (Shift+Enter)">▲</button>
            <button class="find-btn" id="findNextBtn" title="Next (Enter)">▼</button>
            <button class="find-btn find-close-btn" id="findCloseBtn" title="Close (Esc)">✕</button>
          </div>
          <div class="find-row replace-row" id="replaceRow" style="display:none;">
            <span class="find-icon">✏️</span>
            <input class="find-input" id="replaceInput" placeholder="Replace..." spellcheck="false" />
            <button class="find-btn replace-btn" id="replaceOneBtn" title="Replace One">1</button>
            <button class="find-btn replace-btn" id="replaceAllBtn" title="Replace All">All</button>

          <span class="status-item" id="statusChars">Chars: 0</span>

          <span class="status-item" id="statusType">Plain Text</span>

        <div class="editor-hint">
          <span id="autoSaveIndicator" class="auto-save-indicator" style="display:none;">✓ Saved</span>
