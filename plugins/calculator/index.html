<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CALCULATOR</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    /* ========== CSS Variables - Dark Mode (default) ========== */
    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #141414;
      --bg-card: #1a1a1a;
      --bg-slot: #0d0d0d;
      --text-primary: #e0e0e0;
      --text-secondary: #888888;
      --text-muted: #555555;
      --accent-primary: #00ff88;
      --accent-secondary: #ff0080;
      --accent-tertiary: #00d4ff;
      --border-color: #333333;
      --shadow-color: rgba(0, 255, 136, 0.3);
      --scanline-opacity: 0.03;
    }

    /* Light Mode */
    .light-mode {
      --bg-primary: #FFF8E8;
      --bg-secondary: #FFF3D6;
      --bg-card: #FFFEFB;
      --bg-slot: #FFEEC2;
      --text-primary: #C3272B;
      --text-secondary: #C3272B;
      --text-muted: #C3272B;
      --accent-primary: #C3272B;
      --accent-secondary: #cc0066;
      --accent-tertiary: #0099cc;
      --border-color: #E8DCC8;
      --shadow-color: rgba(0, 0, 0, 0.1);
      --scanline-opacity: 0.01;
    }

    /* ========== Base ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { background: transparent; }

    body {
      font-family: 'Press Start 2P', cursive;
      background: var(--bg-secondary);
      color: var(--text-primary);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    /* ========== Main Container ========== */
    .calc-app {
      width: 100%;
      height: 100%;
      background: var(--bg-secondary);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* CRT Scanline */
    .calc-app::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, var(--scanline-opacity, 0.03)) 0px,
        rgba(0, 0, 0, var(--scanline-opacity, 0.03)) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* ========== 装饰螺丝 ========== */
    .deco-screw {
      position: absolute;
      width: 8px;
      height: 8px;
      background: var(--border-color);
      border-radius: 50%;
      z-index: 101;
    }
    .deco-screw::before {
      content: '+';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 6px;
      color: #000;
    }
    .screw-tl { top: 12px; left: 12px; }
    .screw-tr { top: 12px; right: 12px; }
    .screw-bl { bottom: 15px; left: 20px; }
    .screw-br { bottom: 15px; right: 20px; }

    /* ========== Header ========== */
    .calc-header {
      height: 44px;
      background: var(--bg-secondary);
      border-bottom: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      -webkit-app-region: drag;
      flex-shrink: 0;
      position: relative;
      font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    }

    .calc-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .calc-title {
      font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      font-size: 12px;
      color: var(--accent-primary);
      letter-spacing: 3px;
      text-shadow: 0 0 10px var(--accent-primary);
    }

    .calc-chip {
      font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      font-size: 6px;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 3px 5px;
      letter-spacing: 1px;
      margin-left: 4px;
    }

    .calc-close-btn {
      position: absolute;
      top: 8px; right: 12px;
      width: 28px; height: 28px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--accent-primary);
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      -webkit-app-region: no-drag;
      z-index: 102;
    }

    .calc-close-btn:hover {
      color: var(--accent-secondary, #ff0080);
      box-shadow: 0 0 12px var(--shadow-color);
      transform: scale(1.1);
    }

    .calc-pin-btn {
      position: absolute;
      top: 8px;
      right: 48px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--accent-primary);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      -webkit-app-region: no-drag;
      z-index: 102;
    }

    .calc-pin-btn:hover {
      color: var(--accent-secondary, #ff0080);
      box-shadow: 0 0 12px var(--shadow-color);
      transform: scale(1.1) rotate(-15deg);
    }

    .calc-pin-btn.pinned {
      color: var(--accent-secondary, #ff0080);
      transform: rotate(-45deg);
      text-shadow: 0 0 12px var(--accent-secondary, #ff0080);
      filter: drop-shadow(0 0 6px var(--accent-secondary, #ff0080));
    }

    .calc-pin-btn.pinned:hover {
      transform: scale(1.1) rotate(-45deg);
    }

    /* ========== Content ========== */
    .calc-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 14px 18px 16px;
      min-height: 0;
    }

    /* ========== Display ========== */
    .calc-display {
      background: var(--bg-card);
      border: 3px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
      position: relative;
      box-shadow:
        inset 0 0 18px rgba(0, 0, 0, 0.35),
        0 2px 0 rgba(0, 0, 0, 0.2);
    }

    .display-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .brand-dot {
      width: 4px; height: 4px;
      background: var(--accent-primary);
      border-radius: 50%;
      opacity: 0.7;
    }

    .brand-text {
      font-family: 'Press Start 2P', monospace;
      font-size: 6px;
      color: var(--text-muted);
      letter-spacing: 2px;
    }

    .display-expression {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      color: var(--text-muted);
      text-align: right;
      min-height: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      direction: rtl;
    }

    .display-result {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(18px, 7vw, 26px);
      color: var(--accent-primary);
      text-align: right;
      letter-spacing: 1px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 0 10px var(--accent-primary), 0 0 22px var(--shadow-color);
      word-break: break-all;
      transition: opacity 0.13s ease-out;
    }

    .display-result.is-error {
      color: var(--accent-secondary, #ff0080);
      text-shadow: 0 0 10px var(--accent-secondary, #ff0080);
      animation: errorFlash 0.5s steps(2) infinite;
    }

    .display-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 2px;
    }

    .foot-blink {
      font-size: 6px;
      color: var(--accent-primary);
      animation: pulse 1.6s infinite;
    }

    .foot-blink.error {
      color: var(--accent-secondary, #ff0080);
    }

    .foot-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 6px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* ========== Pad Grid ========== */
    .calc-pad {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 1fr;
      gap: 10px;
      min-height: 0;
    }

    .calc-key {
      font-family: 'Press Start 2P', monospace;
      font-size: 15px;
      color: var(--text-primary);
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 var(--border-color);
      transition: all 0.08s ease-out;
      animation: keyIn 0.35s ease-out both;
      -webkit-app-region: no-drag;
    }

    .calc-key:hover {
      border-color: var(--accent-primary);
      box-shadow: 0 4px 0 var(--border-color), 0 0 14px var(--shadow-color);
      color: var(--accent-primary);
      transform: translateY(-1px);
    }

    .calc-key:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--border-color);
    }

    .calc-key:focus-visible {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 4px 0 var(--border-color), 0 0 14px var(--shadow-color);
    }

    .calc-key.fn {
      color: var(--accent-tertiary);
      font-size: 13px;
    }
    .calc-key.fn:hover {
      color: var(--accent-tertiary);
      border-color: var(--accent-tertiary);
      box-shadow: 0 4px 0 var(--border-color), 0 0 14px var(--shadow-color);
    }

    .calc-key.op {
      color: var(--accent-primary);
      font-size: 17px;
    }
    .calc-key.op:hover {
      color: var(--accent-primary);
    }

    .calc-key.eq {
      background: var(--accent-primary);
      color: #000;
      border-color: var(--accent-primary);
      box-shadow: 0 4px 0 color-mix(in srgb, var(--accent-primary) 60%, #000);
      font-size: 18px;
    }
    .calc-key.eq:hover {
      background: var(--accent-secondary, #ff0080);
      border-color: var(--accent-secondary, #ff0080);
      color: #fff;
      box-shadow: 0 4px 0 color-mix(in srgb, var(--accent-secondary) 60%, #000), 0 0 14px var(--shadow-color);
    }
    .calc-key.eq:active {
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.5);
    }

    /* ========== Footer ========== */
    .calc-footer {
      height: 32px;
      background: var(--bg-secondary);
      border-top: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .calc-version {
      font-family: 'Press Start 2P', monospace;
      font-size: 6px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* ========== Animations ========== */
    @keyframes keyIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes errorFlash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ========== Light Mode tweaks ========== */
    .light-mode .calc-display {
      box-shadow:
        inset 0 0 12px rgba(0, 0, 0, 0.08),
        0 2px 0 rgba(0, 0, 0, 0.05);
    }

    .light-mode .calc-key {
      box-shadow: 0 4px 0 #d8cbb2;
    }
    .light-mode .calc-key:hover {
      box-shadow: 0 4px 0 #d8cbb2, 0 0 14px var(--shadow-color);
    }
    .light-mode .calc-key:active {
      box-shadow: 0 1px 0 #d8cbb2;
    }
    .light-mode .calc-key.eq {
      box-shadow: 0 4px 0 #8f1d20;
    }
    .light-mode .calc-key.eq:hover {
      box-shadow: 0 4px 0 #8a0c46, 0 0 14px var(--shadow-color);
    }
    .light-mode .calc-key.eq:active {
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>
  <div class="calc-app" id="calcApp">
    <!-- 装饰螺丝 -->
    <div class="deco-screw screw-tl"></div>
    <div class="deco-screw screw-tr"></div>
    <div class="deco-screw screw-bl"></div>
    <div class="deco-screw screw-br"></div>

    <!-- 头部 -->
    <header class="calc-header">
      <div class="calc-title-row">
        <span class="calc-title">CALCULATOR</span>
        <span class="calc-chip">POCKET EDITION</span>
      </div>
      <button class="calc-pin-btn" id="pinBtn" title="窗口置顶">📌</button>
      <button class="calc-close-btn" id="closeBtn" title="返回母程序">✕</button>
    </header>

    <!-- 内容 -->
    <main class="calc-content">
      <!-- 显示屏 -->
      <div class="calc-display">
        <div class="display-brand">
          <span class="brand-dot"></span>
          <span class="brand-text">POCKET&nbsp;CALC</span>
          <span class="brand-dot"></span>
        </div>
        <div class="display-expression" id="expression">&nbsp;</div>
        <div class="display-result" id="result">0</div>
        <div class="display-footer">
          <span class="foot-blink" id="statusDot">●</span>
          <span class="foot-label" id="statusLabel">READY</span>
        </div>
      </div>

      <!-- 按键网格 -->
      <div class="calc-pad" id="pad"></div>
    </main>

    <!-- 底部 -->
    <footer class="calc-footer">
      <span class="calc-version">MADE BY HUNDUN v1.0.0</span>
    </footer>
  </div>

  <script>
    // ========== PluginSDK: playSound ==========
    const playSound = async (name) => {
      if (window.hundun && window.hundun.host && window.hundun.host.playSound) {
        await window.hundun.host.playSound(name);
      }
    };

    // ========== 主题 ==========
    const applyTheme = (isDark) => {
      document.body.classList.toggle('light-mode', !isDark);
    };

    // ========== 状态 ==========
    let currentInput = '0';
    let acc = 0;
    let pendingOp = null;
    let waitingForOperand = false;
    let isError = false;
    let expressionText = '';

    // ========== DOM ==========
    const expressionEl = document.getElementById('expression');
    const resultEl = document.getElementById('result');
    const statusDot = document.getElementById('statusDot');
    const statusLabel = document.getElementById('statusLabel');
    const padEl = document.getElementById('pad');

    // ========== 按键定义 ==========
    const padKeys = [
      { id: 'ac',  label: 'AC', action: 'clear',     cls: 'fn' },
      { id: 'bs',  label: '⌫',  action: 'backspace', cls: 'fn' },
      { id: 'pct', label: '%',  action: 'percent',   cls: 'fn' },
      { id: 'div', label: '÷',  action: 'op',        cls: 'op' },
      { id: '7',   label: '7',  action: 'digit' },
      { id: '8',   label: '8',  action: 'digit' },
      { id: '9',   label: '9',  action: 'digit' },
      { id: 'mul', label: '×',  action: 'op',        cls: 'op' },
      { id: '4',   label: '4',  action: 'digit' },
      { id: '5',   label: '5',  action: 'digit' },
      { id: '6',   label: '6',  action: 'digit' },
      { id: 'sub', label: '−',  action: 'op',        cls: 'op' },
      { id: '1',   label: '1',  action: 'digit' },
      { id: '2',   label: '2',  action: 'digit' },
      { id: '3',   label: '3',  action: 'digit' },
      { id: 'add', label: '+',  action: 'op',        cls: 'op' },
      { id: 'sign',label: '±',  action: 'sign',      cls: 'fn' },
      { id: '0',   label: '0',  action: 'digit' },
      { id: 'dot', label: '.',  action: 'dot' },
      { id: 'eq',  label: '=',  action: 'equals',    cls: 'eq' }
    ];

    // ========== 显示 ==========
    const updateDisplay = () => {
      if (isError) {
        resultEl.textContent = 'ERROR';
        resultEl.classList.add('is-error');
        statusDot.classList.add('error');
        statusLabel.textContent = 'SYNTAX ERROR';
      } else {
        let s = currentInput;
        if (s.length > 12) s = s.slice(0, 12);
        resultEl.textContent = s;
        resultEl.classList.remove('is-error');
        statusDot.classList.remove('error');
        statusLabel.textContent = 'READY';
      }
      expressionEl.textContent = expressionText || '\u00A0';
    };

    // ========== 核心计算 ==========
    const calculate = (a, b, op) => {
      switch (op) {
        case '+': return a + b;
        case '−': return a - b;
        case '×': return a * b;
        case '÷': return a / b;
      }
    };

    const formatNumber = (num) => {
      if (num === 0) return '0';
      return String(Math.round(num * 1e10) / 1e10);
    };

    const formatResult = (num) => {
      if (num === 0) return '0';
      let str = String(Math.round(num * 1e10) / 1e10);
      if (str.length > 11) {
        str = num.toExponential(6);
      }
      return str;
    };

    const showError = () => {
      isError = true;
      currentInput = 'ERROR';
      pendingOp = null;
      waitingForOperand = true;
      playSound('error');
    };

    // ========== 输入操作 ==========
    const inputDigit = (digit) => {
      playSound('click');
      if (isError) clearAll();
      if (waitingForOperand) {
        currentInput = String(digit);
        waitingForOperand = false;
        updateDisplay();
        return;
      }
      if (currentInput === '0') {
        currentInput = String(digit);
        updateDisplay();
        return;
      }
      if (currentInput.replace(/[^0-9]/g, '').length >= 10) return;
      currentInput += String(digit);
      updateDisplay();
    };

    const inputDot = () => {
      playSound('click');
      if (isError) clearAll();
      if (waitingForOperand) {
        currentInput = '0.';
        waitingForOperand = false;
        updateDisplay();
        return;
      }
      if (!currentInput.includes('.')) {
        currentInput += '.';
      }
      updateDisplay();
    };

    const setOperator = (op) => {
      playSound('click');
      if (isError) return;
      const inputValue = parseFloat(currentInput);

      if (pendingOp !== null && !waitingForOperand) {
        const result = calculate(acc, inputValue, pendingOp);
        if (isNaN(result) || !isFinite(result)) { showError(); updateDisplay(); return; }
        acc = result;
        currentInput = formatResult(result);
      } else {
        acc = inputValue;
      }
      pendingOp = op;
      waitingForOperand = true;
      expressionText = `${formatNumber(acc)} ${op}`;
      updateDisplay();
    };

    const equals = () => {
      if (pendingOp === null || isError) return;
      playSound('click');
      const inputValue = parseFloat(currentInput);
      const result = calculate(acc, inputValue, pendingOp);
      expressionText = `${formatNumber(acc)} ${pendingOp} ${formatNumber(inputValue)} =`;
      pendingOp = null;
      waitingForOperand = true;

      if (isNaN(result) || !isFinite(result)) {
        showError();
      } else {
        currentInput = formatResult(result);
      }
      updateDisplay();
    };

    const clearAll = () => {
      playSound('click');
      currentInput = '0';
      acc = 0;
      pendingOp = null;
      waitingForOperand = false;
      isError = false;
      expressionText = '';
      updateDisplay();
    };

    const backspace = () => {
      playSound('click');
      if (waitingForOperand || isError) return;
      if (currentInput.length <= 1 ||
          (currentInput.length === 2 && currentInput.startsWith('-'))) {
        currentInput = '0';
      } else {
        currentInput = currentInput.slice(0, -1);
      }
      updateDisplay();
    };

    const toggleSign = () => {
      playSound('click');
      if (currentInput === '0' || isError) return;
      currentInput = currentInput.startsWith('-')
        ? currentInput.slice(1)
        : '-' + currentInput;
      updateDisplay();
    };

    const percent = () => {
      playSound('click');
      if (isError) return;
      const value = parseFloat(currentInput);
      currentInput = formatResult(value / 100);
      updateDisplay();
    };

    // ========== 按键分发 ==========
    const onKeyPress = (key) => {
      switch (key.action) {
        case 'digit':     inputDigit(key.label); break;
        case 'dot':       inputDot(); break;
        case 'op':        setOperator(key.label); break;
        case 'equals':    equals(); break;
        case 'clear':     clearAll(); break;
        case 'backspace': backspace(); break;
        case 'percent':   percent(); break;
        case 'sign':      toggleSign(); break;
      }
    };

    // ========== 键盘输入 ==========
    const handleKey = (e) => {
      if (e.key === 'Escape') {
        returnToParent();
        return;
      }

      if (/^[0-9]$/.test(e.key)) inputDigit(e.key);
      else if (e.key === '.') inputDot();
      else if (e.key === '+') setOperator('+');
      else if (e.key === '-') setOperator('−');
      else if (e.key === '*') setOperator('×');
      else if (e.key === '/') { e.preventDefault(); setOperator('÷'); }
      else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); equals(); }
      else if (e.key === 'Backspace') backspace();
      else if (e.key === '%') percent();
      else if (e.key === 'c' || e.key === 'C') clearAll();
    };

    // ========== 返回母程序 ==========
    const returnToParent = async () => {
      if (window.hundun && window.hundun.host && window.hundun.host.returnToParent) {
        await window.hundun.host.returnToParent();
      } else if (window.hundun && window.hundun.window && window.hundun.window.close) {
        await window.hundun.window.close();
      } else {
        window.close();
      }
    };

    // ========== 窗口置顶 ==========
    const pinBtn = document.getElementById('pinBtn');
    if (pinBtn) {
      pinBtn.addEventListener('click', async () => {
        pinBtn.classList.toggle('pinned');
        const pinned = pinBtn.classList.contains('pinned');
        if (window.hundun && window.hundun.window && window.hundun.window.setAlwaysOnTop) {
          await window.hundun.window.setAlwaysOnTop(pinned);
        }
      });
    }

    // ========== 初始化 ==========
    const init = () => {
      // 渲染按键
      padEl.innerHTML = '';
      padKeys.forEach((key, idx) => {
        const btn = document.createElement('button');
        btn.className = 'calc-key' + (key.cls ? ' ' + key.cls : '');
        btn.textContent = key.label;
        btn.style.animationDelay = `${0.15 + idx * 0.02}s`;
        btn.addEventListener('click', () => onKeyPress(key));
        padEl.appendChild(btn);
      });

      updateDisplay();

      // 键盘监听
      document.addEventListener('keydown', handleKey);

      // 关闭按钮
      document.getElementById('closeBtn').addEventListener('click', returnToParent);

      // 主题
      if (window.hundun && window.hundun.host) {
        window.hundun.host.getTheme().then(applyTheme);
        window.hundun.host.onThemeChange(applyTheme);
      }
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
